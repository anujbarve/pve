<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Decision Fatigue — Jack Butcher Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000000;
        overflow: hidden;
      }
      #root {
        width: 1080px;
        height: 1920px;
        position: relative;
        overflow: hidden;
        background: #000000;
      }
      .film-shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div
      data-hf-id="root"
      id="root"
      data-composition-id="decision-fatigue-main"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="53.62"
    >
      <!-- Shot 01: The Nighttime Paralysis (0.00s - 10.58s) -->
      <div
        data-hf-id="s01"
        id="s01"
        class="clip film-shot"
        data-composition-id="shot-01-fridge"
        data-composition-src="compositions/frames/shot-01-fridge.html"
        data-start="0.00"
        data-duration="10.58"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 02: The Neural Fuel Tank (10.58s - 21.16s) -->
      <div
        data-hf-id="s02"
        id="s02"
        class="clip film-shot"
        data-composition-id="shot-02-fuel"
        data-composition-src="compositions/frames/shot-02-fuel.html"
        data-start="10.58"
        data-duration="10.58"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 03: The Cognitive Downshift (21.16s - 31.74s) -->
      <div
        data-hf-id="s03"
        id="s03"
        class="clip film-shot"
        data-composition-id="shot-03-downshift"
        data-composition-src="compositions/frames/shot-03-downshift.html"
        data-start="21.16"
        data-duration="10.58"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 04: The Default Trap (31.74s - 44.72s) -->
      <div
        data-hf-id="s04"
        id="s04"
        class="clip film-shot"
        data-composition-id="shot-04-court"
        data-composition-src="compositions/frames/shot-04-court.html"
        data-start="31.74"
        data-duration="12.98"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 05: The Shield of Routine (44.72s - 53.62s) -->
      <div
        data-hf-id="s05"
        id="s05"
        class="clip film-shot"
        data-composition-id="shot-05-shield"
        data-composition-src="compositions/frames/shot-05-shield.html"
        data-start="44.72"
        data-duration="8.90"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Master 3-Layer Audio Soundtrack (VO + BGM + SFX) -->
      <audio
        data-hf-id="audio-master"
        id="audio-master"
        src=".temp_audio/master_sound_design.wav"
        data-start="0"
        data-duration="53.62"
        data-track-index="10"
        data-volume="1.0"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const masterTl = gsap.timeline({ paused: true });
      window.__timelines["decision-fatigue-main"] = masterTl;

      const s01 = document.getElementById("s01");
      const s02 = document.getElementById("s02");
      const s03 = document.getElementById("s03");
      const s04 = document.getElementById("s04");
      const s05 = document.getElementById("s05");

      // Crisp cuts between mental model diagrams
      masterTl.fromTo(s02, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 10.58);
      masterTl.fromTo(s03, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 21.16);
      masterTl.fromTo(s04, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 31.74);
      masterTl.fromTo(s05, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 44.72);
    </script>
  </body>
</html>
