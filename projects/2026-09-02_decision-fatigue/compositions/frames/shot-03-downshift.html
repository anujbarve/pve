  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["shot-03-downshift"] = tl;

    const env = document.getElementById("s03-env");
    const stage = document.getElementById("s03-stage");
    const execCard = document.getElementById("s03-exec-card");
    const execBadge = document.getElementById("s03-exec-badge");
    const impCard = document.getElementById("s03-impulse-card");
    const impBadge = document.getElementById("s03-impulse-badge");

    const impSegs = document.querySelectorAll(".s03-imp-seg");
    const caption = document.getElementById("s03-caption");
    const sub = document.getElementById("s03-sub");

    gsap.set(stage, { scale: 0.95 });

    // Smooth forward push
    tl.to(env, { scale: 1.05, duration: 10.58, ease: "none" }, 0);
    tl.to(stage, { scale: 1.02, duration: 10.58, ease: "power1.out" }, 0);

    // 2.5s - 5.0s: Downshift trigger

      opacity: 0.2,
      stagger: 0.1,
      duration: 0.8,
      ease: "power2.inOut"

      impBadge.style.color = "#E27D44";
      impBadge.style.boxShadow = "0 0 20px rgba(212, 98, 43, 0.5)";
    }, null, 4.8);

      { opacity: 1, scaleY: 1, stagger: 0.1, duration: 0.8, ease: "back.out(2)" },
