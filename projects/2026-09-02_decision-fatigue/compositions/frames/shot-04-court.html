  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const stage = document.getElementById("s04-stage");
    const curve = document.getElementById("s04-curve");
    const ptMorn = document.getElementById("s04-pt-morn");

    const statSub = document.getElementById("s04-stat-sub");
    const caption = document.getElementById("s04-caption");
    const sub = document.getElementById("s04-sub");

    gsap.set(stage, { scale: 0.95 });
    gsap.set(ptCrash, { opacity: 0, scale: 0.8 });

    // Camera push-in
    tl.to(env, { scale: 1.05, duration: 12.98, ease: "none" }, 0);
    tl.to(stage, { scale: 1.02, duration: 12.98, ease: "power1.out" }, 0);

    // Initial state: Morning 65%

    // 5.5s: "...but plummeted to zero before lunch—simply because saying no requires less mental energy."
