    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["shot-02-fuel"] = tl;

    const env = document.getElementById("s02-env");
    const stage = document.getElementById("s02-stage");
    const liquid = document.getElementById("s02-liquid");
    const gaugeVal = document.getElementById("s02-gauge-val");
    const s1 = document.getElementById("s02-siphon-1");
    const s2 = document.getElementById("s02-siphon-2");

    const s4 = document.getElementById("s02-siphon-4");
    const caption = document.getElementById("s02-caption");
    const sub = document.getElementById("s02-sub");

    gsap.set([s1, s2, s3, s4], { opacity: 0, scale: 0.85 });
    gsap.set(liquid, { height: "100%" });
    gsap.set(stage, { scale: 0.95 });

    // Smooth forward push
    tl.to(env, { scale: 1.05, duration: 10.58, ease: "none" }, 0);
    tl.to(stage, { scale: 1.02, duration: 10.58, ease: "power1.out" }, 0);

    tl.to(liquid, { height: "82%", duration: 0.8, ease: "power2.out" }, 2.2);
    tl.call(() => { gaugeVal.innerText = "82%"; }, null, 2.6);

    tl.to(liquid, { height: "60%", duration: 0.8, ease: "power2.out" }, 4.2);

      sub.innerText = 'Prefrontal Glucose Depletion';
