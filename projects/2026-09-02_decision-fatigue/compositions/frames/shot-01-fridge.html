  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["shot-01-fridge"] = tl;

    const env = document.getElementById("s01-env");
    const stage = document.getElementById("s01-stage");
    const residuals = document.getElementById("s01-residuals");
    const clockTime = document.getElementById("s01-clock-time");
    const hud = document.getElementById("s01-hud");
    const freezeRing = document.getElementById("s01-freeze");
    const caption = document.getElementById("s01-caption");
    const sub = document.getElementById("s01-sub");
    const cone = document.getElementById("s01-cone");

    gsap.set(freezeRing, { opacity: 0, scale: 0.85 });
    gsap.set(hud, { opacity: 0, scale: 0.9 });
    gsap.set(stage, { scale: 0.94 });
    gsap.set(cone, { opacity: 0.7 });

    // Smooth forward push-in
    tl.to(env, { scale: 1.06, duration: 10.58, ease: "none" }, 0);
    tl.to(stage, { scale: 1.03, duration: 10.58, ease: "power1.out" }, 0);

    // Daytime residuals fade away in the shadows
    tl.to(residuals, { opacity: 0.15, y: -20, duration: 3.5, ease: "power2.out" }, 1.5);

    // Clock ticks to 21:02 at 6.0s
    tl.call(() => {
      clockTime.innerText = "21:02";
      gsap.fromTo(clockTime, { color: "#FFF" }, { color: "#D4622B", duration: 0.6 });
    }, null, 6.0);

    // 6.5s: "...yet at nine PM, you stand paralyzed before an open refrigerator."
    tl.call(() => {
      caption.innerHTML = 'yet at 9:00 PM, you stand <span class="accent">paralyzed before an open refrigerator</span>.';
      sub.innerText = 'The Evening Breakdown';
    }, null, 6.2);

    tl.to(hud, { opacity: 1, scale: 1, duration: 0.8, ease: "back.out(1.5)" }, 6.5);
    tl.to(freezeRing, { opacity: 0.9, scale: 1.05, duration: 1.2, ease: "power2.out" }, 6.8);
