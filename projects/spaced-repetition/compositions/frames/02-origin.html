  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["02-origin"] = tl;

    const scene = document.getElementById("f02-scene");
    const year = document.getElementById("f02-year");
    const clock = document.getElementById("f02-clock");
    const journal = document.getElementById("f02-journal");
    const lines = document.querySelectorAll(".writing-line");
    const letters = document.querySelectorAll(".letter");
    const minuteHand = document.getElementById("f02-minute");
    const capwrap = document.getElementById("f02-capwrap");
    const capText = document.getElementById("f02-caption");

    // Initial states
    gsap.set(year, { opacity: 0 });
    gsap.set(clock, { opacity: 0 });
    gsap.set(journal, { opacity: 0, scale: 0.95 });
    gsap.set(capwrap, { opacity: 0 });

    // 0.0 - 3.0s: Slow push-in on study
    tl.to(scene, { scale: 1.08, duration: 6, ease: "power1.inOut" }, 0);

    // 0.5 - 1.5s: Year etching appears
    tl.to(year, { opacity: 1, duration: 1.5, ease: "power2.out" }, 0.5);

    // 1.5 - 2.5s: Clock appears
    tl.to(clock, { opacity: 0.6, duration: 1.0, ease: "power2.out" }, 1.5);

    // 2.0 - 3.0s: Clock hands move backward
    tl.to(minuteHand, { rotation: -270, duration: 4, ease: "power1.inOut" }, 2.0);

    // 3.0 - 4.0s: Journal appears
    tl.to(journal, { opacity: 1, scale: 1, duration: 0.8, ease: "power2.out" }, 3.0);

    // 4.0 - 7.0s: Writing lines appear one by one
    tl.to(lines, { opacity: 1, duration: 0.3, stagger: 0.4, ease: "power2.out" }, 4.0);

    // 8.0 - 12.0s: Letters scatter across page
    tl.to(letters, { opacity: 0.8, duration: 0.4, stagger: 0.3, ease: "power2.out" }, 8.0);

    // 14.0 - 17.0s: Letters fade (forgetting)
    tl.to(letters, { 
      opacity: 0, 
      y: 10, 
      duration: 0.8, 
      stagger: { each: 0.15, from: "random" }, 
      ease: "power2.in" 
    }, 14.0);

    // 17.0 - 19.0s: Writing lines fade
    tl.to(lines, { opacity: 0.2, duration: 1.5, ease: "power2.in" }, 17.0);

    // Caption updates
    tl.to(capwrap, { opacity: 1, duration: 0.5 }, 0.5);

    tl.call(() => {
      capText.innerHTML = 'He tried to remember <span class="cap-hl">nonsense syllables</span>.';
    }, null, 5.0);
    tl.to(capwrap, { opacity: 0, duration: 0.3 }, 4.8);
    tl.to(capwrap, { opacity: 1, duration: 0.4 }, 5.0);

    tl.call(() => {
      capText.innerHTML = 'Then he <span class="cap-hl">forgot</span>.';
    }, null, 10.0);
    tl.to(capwrap, { opacity: 0, duration: 0.3 }, 9.8);
    tl.to(capwrap, { opacity: 1, duration: 0.4 }, 10.0);

    tl.call(() => {
      capText.innerHTML = 'And he measured exactly how fast <span class="cap-hl">memory dies</span>.';
    }, null, 14.0);
    tl.to(capwrap, { opacity: 0, duration: 0.3 }, 13.8);
    tl.to(capwrap, { opacity: 1, duration: 0.4 }, 14.0);
  </script>
