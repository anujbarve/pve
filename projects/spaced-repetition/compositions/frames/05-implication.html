  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <div data-hf-id="hf-05-root" id="root" data-composition-id="05-implication" data-width="1080" data-height="1920" data-duration="14.52">
    
    <!-- Cinematic scene -->
    <div data-hf-id="hf-05-scene" id="f05-scene" class="clip scene-layer" data-start="0" data-duration="14.52" data-track-index="0">
      <div data-hf-id="hf-05-env" class="library-env">
        
        <!-- Left: Chaos -->
        <div data-hf-id="hf-05-left" class="library-left">
          <div data-hf-id="hf-05-label-left" class="side-label left">CRAMMING</div>
          
          <div data-hf-id="hf-05-chaos" id="f05-chaos" class="chaos-desk">
            <!-- Scattered books -->
            <div data-hf-id="hf-cb1" class="chaos-book" style="width: 80px; height: 100px; top: 10%; left: 5%; transform: rotate(-15deg);"></div>
            <div data-hf-id="hf-cb2" class="chaos-book" style="width: 70px; height: 90px; top: 20%; left: 40%; transform: rotate(8deg);"></div>
            <div data-hf-id="hf-cb3" class="chaos-book" style="width: 90px; height: 110px; top: 5%; left: 65%; transform: rotate(-5deg);"></div>

            <!-- Scattered notes -->
            <div data-hf-id="hf-cn1" class="chaos-note" style="width: 100px; height: 60px; top: 15%; left: 25%; transform: rotate(-10deg);">
              <div class="chaos-note-line" style="width: 80%;"></div>

          <div data-hf-id="hf-05-calm" id="f05-calm" class="calm-desk">

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["05-implication"] = tl;

    const chaos = document.getElementById("f05-chaos");
    const calm = document.getElementById("f05-calm");
    const labelLeft = document.querySelector(".side-label.left");
    const labelRight = document.querySelector(".side-label.right");
    const chaosBooks = document.querySelectorAll(".chaos-book");
    const chaosNotes = document.querySelectorAll(".chaos-note");
    const capwrap = document.getElementById("f05-capwrap");
    const capText = document.getElementById("f05-caption");

    // Initial states - use xPercent for centering instead of CSS transform
    gsap.set(chaos, { opacity: 0 });
    gsap.set(calm, { opacity: 0 });
    gsap.set(labelLeft, { opacity: 0, y: 10, xPercent: -50 });
    gsap.set(labelRight, { opacity: 0, y: 10, xPercent: -50 });
    gsap.set(capwrap, { opacity: 0 });

    // Predefined rotation values instead of random()
    const bookRotations = [-25, 18, -12, 22, -8];
    const bookX = [-15, 12, -8, 18, -12];
    const bookY = [-10, 8, -12, 6, -8];
    const noteRotations = [-18, 14, -8];
    const noteX = [-12, 10, -8];

    // 0.0 - 2.0s: Left side (chaos) appears
    tl.to(chaos, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0.5);
    tl.to(labelLeft, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.8);

    // 1.0 - 3.0s: Chaos books and notes scatter with fixed values
    tl.to(chaosBooks, { 
      rotation: function(i) { return bookRotations[i]; },
      x: function(i) { return bookX[i]; },
      y: function(i) { return bookY[i]; },
      duration: 0.5, 
      stagger: 0.1,
      ease: "power2.out" 
    }, 1.0);
    tl.to(chaosNotes, { 
      rotation: function(i) { return noteRotations[i]; },
      x: function(i) { return noteX[i]; },
      duration: 0.4, 
      stagger: 0.1,
      ease: "power2.out" 
    }, 1.5);

    // 4.0 - 6.0s: Chaos starts fading (cramming fails)
    tl.to(chaos, { opacity: 0.3, duration: 1.5, ease: "power2.in" }, 4.0);
    tl.to(labelLeft, { opacity: 0.3, duration: 1.0 }, 4.0);

    // 5.0 - 7.0s: Right side (calm) appears
    tl.to(calm, { opacity: 1, duration: 1.0, ease: "power2.out" }, 5.0);
    tl.to(labelRight, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 5.5);

    // 7.0 - 10.0s: Slow push-in on calm side
    tl.to(calm, { scale: 1.05, duration: 4, ease: "power1.inOut" }, 7.0);

    // 10.0 - 12.0s: Chaos completely disappears
    tl.to(chaos, { opacity: 0, duration: 1.5, ease: "power2.in" }, 10.0);
    tl.to(labelLeft, { opacity: 0, duration: 1.0 }, 10.0);

    // Caption updates
    tl.to(capwrap, { opacity: 1, duration: 0.5 }, 0.5);

    tl.call(() => {
      capText.innerHTML = 'Without forgetting, there\'s no <span class="cap-hl">strengthening</span>.';
    }, null, 4.0);
    tl.to(capwrap, { opacity: 0, duration: 0.3 }, 3.8);
    tl.to(capwrap, { opacity: 1, duration: 0.4 }, 4.0);

    tl.call(() => {
      capText.innerHTML = 'Spacing isn\'t a hack. It\'s how your brain <span class="cap-hl">learns</span>.';
    }, null, 8.0);
    tl.to(capwrap, { opacity: 0, duration: 0.3 }, 7.8);
    tl.to(capwrap, { opacity: 1, duration: 0.4 }, 8.0);
  </script>
