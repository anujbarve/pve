  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["03-mechanism"] = tl;

    const neuralSvg = document.querySelector(".neural-svg");
    const connections = document.getElementById("neural-connections");
    const nodes = document.querySelectorAll(".node");
    const outputNodes = document.querySelectorAll(".output");
    const paper = document.getElementById("f03-paper");
    const screen = document.getElementById("f03-screen");
    const capwrap = document.getElementById("f03-capwrap");
    const capText = document.getElementById("f03-caption");

    // Initial states
    gsap.set(paper, { opacity: 0 });
    gsap.set(screen, { opacity: 0 });
    gsap.set(capwrap, { opacity: 0 });

    // 0.0 - 2.0s: Neural network fades in, filling the frame
    tl.to(neuralSvg, { opacity: 1, duration: 1.5, ease: "power2.out" }, 0.3);
    tl.to(connections, { opacity: 1, duration: 1.0, ease: "power2.out" }, 0.5);
    tl.to(nodes, { opacity: 1, duration: 0.5, stagger: 0.05, ease: "power2.out" }, 1.0);

    // 2.0 - 6.0s: Slow push-in on network
    tl.to(neuralSvg, { scale: 1.15, duration: 6, ease: "power1.inOut" }, 2.0);

    // 5.0 - 10.0s: Connections start dimming (forgetting)
    tl.to("line", { 
      stroke: "rgba(100, 180, 255, 0.1)", 
      duration: 2, 
      stagger: { each: 0.1, from: "random" },
      ease: "power2.in" 
    }, 5.0);

    // 8.0 - 12.0s: Nodes start disappearing
    tl.to(nodes, { 
      opacity: 0, 
      scale: 0.5, 
      duration: 0.8, 
      stagger: { each: 0.1, from: "random" },
      ease: "power2.in" 
    }, 8.0);

    // 10.0 - 12.0s: Paper appears (the network was drawn on paper)
    tl.to(paper, { opacity: 1, duration: 0.8, ease: "power2.out" }, 10.0);
    tl.to(neuralSvg, { opacity: 0, duration: 0.5 }, 10.5);

    // 12.0 - 14.0s: Paper crumples (visual metaphor for forgetting)
    tl.to(paper, { 
      scale: 0.8, 
      rotation: -5, 
      borderRadius: "50%", 
      duration: 1.5, 
      ease: "power2.in" 
    }, 12.0);
    tl.to(paper, { opacity: 0, duration: 0.5, ease: "power2.in" }, 13.5);

    // 14.0 - 16.0s: Screen appears with curve
    tl.to(screen, { opacity: 1, duration: 1.0, ease: "power2.out" }, 14.0);

    // Caption updates
    tl.to(capwrap, { opacity: 1, duration: 0.5 }, 0.5);

    tl.call(() => {
      capText.innerHTML = 'Without review, you lose <span class="cap-hl">70%</span> of new information within 24 hours.';
    }, null, 3.0);
    tl.to(capwrap, { opacity: 0, duration: 0.3 }, 2.8);
    tl.to(capwrap, { opacity: 1, duration: 0.4 }, 3.0);

    tl.call(() => {
      capText.innerHTML = 'The curve doesn\'t decline gently. It falls off a <span class="cap-hl">cliff</span>.';
    }, null, 8.0);
    tl.to(capwrap, { opacity: 0, duration: 0.3 }, 7.8);
    tl.to(capwrap, { opacity: 1, duration: 0.4 }, 8.0);

    // Continuous pulse on output nodes
    tl.to(outputNodes, { 
      scale: 1.3, 
      duration: 1.5, 
      ease: "sine.inOut", 
      yoyo: true, 
      repeat: 4,
      stagger: 0.2
    }, 0);
  </script>
