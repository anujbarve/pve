  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

      <div data-hf-id="hf-04-stage1" id="f04-stage1" class="book-stage" style="transform: translate(-50%, -50%) rotateX(12deg) rotateY(-8deg);">
        <div data-hf-id="hf-04-book1" class="book-obj">
          <div data-hf-id="hf-04-page1" class="book-page-content" style="background: linear-gradient(135deg, #f0e8d0 0%, #e0d8c0 100%);">
            <div data-hf-id="hf-04-text1" class="page-text">

          <div data-hf-id="hf-04-page2" class="book-page-content" style="background: linear-gradient(135deg, #f8f4e8 0%, #f0ece0 100%);">

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["04-reveal"] = tl;

    const stage1 = document.getElementById("f04-stage1");
    const stage2 = document.getElementById("f04-stage2");
    const stage3 = document.getElementById("f04-stage3");
    const calendar = document.getElementById("f04-calendar");
    const calMarks = document.querySelectorAll(".cal-mark");
    const pathLine = document.getElementById("path-line");
    const capwrap = document.getElementById("f04-capwrap");
    const capText = document.getElementById("f04-caption");

    // Initial states
    gsap.set(stage1, { opacity: 0, scale: 0.9 });
    gsap.set(stage2, { opacity: 0, scale: 0.9 });
    gsap.set(stage3, { opacity: 0, scale: 0.9 });
    gsap.set(calendar, { opacity: 0 });
    gsap.set(capwrap, { opacity: 0 });

    // 0.0 - 2.0s: Stage 1 appears - first read
    tl.to(stage1, { opacity: 1, scale: 1, duration: 1.0, ease: "power2.out" }, 0.5);

    // 2.0 - 3.0s: Bookmark appears
    tl.to(".bookmark", { opacity: 1, duration: 0.5, ease: "power2.out" }, 2.0);

    // 3.0 - 5.0s: Transition to stage 2 - review
    tl.to(stage1, { opacity: 0, scale: 0.95, duration: 0.8, ease: "power2.in" }, 4.0);
    tl.to(stage2, { opacity: 1, scale: 1, duration: 0.8, ease: "power2.out" }, 4.2);

    // 5.0 - 6.0s: Calendar appears
    tl.to(calendar, { opacity: 1, duration: 0.6, ease: "power2.out" }, 5.0);
    tl.to(calMarks, { opacity: 1, duration: 0.3, stagger: 0.2, ease: "power2.out" }, 5.2);

    // 7.0 - 9.0s: Transition to stage 3 - permanent memory
    tl.to(stage2, { opacity: 0, scale: 0.95, duration: 0.8, ease: "power2.in" }, 7.5);
    tl.to(stage3, { opacity: 1, scale: 1, duration: 0.8, ease: "power2.out" }, 7.7);

    // 9.0 - 11.0s: Path draws itself (worn path metaphor)
    tl.to(pathLine, { strokeDashoffset: 0, duration: 2.0, ease: "power2.inOut" }, 9.0);

    // 11.0 - 13.0s: Slow push-in on final book
    tl.to(stage3, { scale: 1.1, duration: 3, ease: "power1.inOut" }, 10.0);

    // Caption updates
    tl.to(capwrap, { opacity: 1, duration: 0.5 }, 0.5);

    tl.call(() => {
      capText.innerHTML = 'If you review right before you forget, the curve <span class="cap-hl">resets</span>.';
    }, null, 3.0);
    tl.to(capwrap, { opacity: 0, duration: 0.3 }, 2.8);
    tl.to(capwrap, { opacity: 1, duration: 0.4 }, 3.0);

    tl.call(() => {
      capText.innerHTML = 'Each time it resets, the decay gets <span class="cap-hl">slower</span>.';
    }, null, 6.0);
    tl.to(capwrap, { opacity: 0, duration: 0.3 }, 5.8);
    tl.to(capwrap, { opacity: 1, duration: 0.4 }, 6.0);

    tl.call(() => {
      capText.innerHTML = 'The memory gets <span class="cap-hl">stronger</span>.';
    }, null, 10.0);
    tl.to(capwrap, { opacity: 0, duration: 0.3 }, 9.8);
    tl.to(capwrap, { opacity: 1, duration: 0.4 }, 10.0);
  </script>
