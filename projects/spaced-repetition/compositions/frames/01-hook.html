    <!-- Cinematic scene layer -->

      <div data-hf-id="hf-01-desk" class="desk-environment">
        <div data-hf-id="hf-01-light" class="light-pool"></div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["01-hook"] = tl;

    const scene = document.getElementById("f01-scene");
    const book = document.getElementById("f01-book");
    const page = document.getElementById("f01-page");
    const blank = document.getElementById("f01-blank");
    const hand = document.getElementById("f01-hand");
    const typeMoment = document.getElementById("f01-type");
    const line1 = document.getElementById("f01-line1");
    const line2 = document.getElementById("f01-line2");
    const line3 = document.getElementById("f01-line3");
    const capwrap = document.getElementById("f01-capwrap");
    const capPill = document.getElementById("f01-pill");
    const capText = document.getElementById("f01-caption");

    // Initial states
    gsap.set(typeMoment, { opacity: 0 });
    gsap.set([line1, line2, line3], { opacity: 0, y: 20 });
    gsap.set(capwrap, { opacity: 0 });

    // 0.0 - 1.5s: Slow push-in on desk environment
    tl.to(scene, { scale: 1.05, duration: 3, ease: "power1.inOut" }, 0);

    // 0.3 - 1.0s: Hand appears, reaches for book
    tl.to(hand, { opacity: 0.7, x: -20, duration: 0.7, ease: "power2.out" }, 0.3);

    // 1.0 - 2.0s: Book page appears (confident learning moment)
    tl.to(page, { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.0);
    tl.to(hand, { opacity: 0, x: -40, duration: 0.4, ease: "power2.in" }, 1.2);

    // 2.5 - 3.5s: Page fades to blank (forgetting)
    tl.to(page, { opacity: 0, duration: 1.0, ease: "power2.in" }, 2.5);
    tl.to(blank, { opacity: 1, duration: 0.8, ease: "power2.out" }, 3.0);

    // 4.0 - 5.5s: Typography moment appears
    tl.to(typeMoment, { opacity: 1, duration: 0.3 }, 4.0);
    tl.to(line1, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 4.2);
    tl.to(line2, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 4.7);
    tl.to(line3, { opacity: 1, y: 0, duration: 0.8, ease: "back.out(1.5)" }, 5.5);

    // 5.8 - 6.5s: Typography fades, return to scene
    tl.to(typeMoment, { opacity: 0, duration: 0.5, ease: "power2.in" }, 6.0);

    // Caption
    tl.to(capwrap, { opacity: 1, duration: 0.5 }, 0.5);
