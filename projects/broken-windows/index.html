<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=2160, height=3840">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 2160px; height: 3840px; overflow: hidden; background: #000; }
      #root {
        position: relative; width: 2160px; height: 3840px;
        overflow: hidden; background: #000000;
      }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-bw-root" id="root" data-composition-id="main" data-start="0" data-duration="61.14" data-width="2160" data-height="3840">

      <!-- NARRATION AUDIO — wired in so preview plays it -->
      <audio data-hf-id="audio-narration"
             id="audio-narration"
             src=".temp_audio/narration_full.wav"
             data-start="0"
             data-duration="61.14"
             data-track-index="10"
             data-volume="1.0"></audio>

      <!-- SCENES — timings derived from actual TTS durations -->
      <div data-hf-id="hf-s1" id="el-01-hook" class="scene" data-composition-id="01-hook" data-composition-src="compositions/frames/01-hook.html" data-start="0" data-duration="9.5" data-track-index="0"></div>

      <div data-hf-id="hf-s2" id="el-02-origin" class="scene" data-composition-id="02-origin" data-composition-src="compositions/frames/02-origin.html" data-start="9.0" data-duration="9.66" data-track-index="1"></div>

      <div data-hf-id="hf-s3" id="el-03-mechanism" class="scene" data-composition-id="03-mechanism" data-composition-src="compositions/frames/03-mechanism.html" data-start="18.66" data-duration="12.14" data-track-index="0"></div>

      <div data-hf-id="hf-s4" id="el-04-cascade" class="scene" data-composition-id="04-cascade" data-composition-src="compositions/frames/04-cascade.html" data-start="30.3" data-duration="13.98" data-track-index="1"></div>

      <div data-hf-id="hf-s5" id="el-05-reframe" class="scene" data-composition-id="05-reframe" data-composition-src="compositions/frames/05-reframe.html" data-start="43.78" data-duration="7.1" data-track-index="0"></div>

      <div data-hf-id="hf-s6" id="el-06-lesson" class="scene" data-composition-id="06-lesson" data-composition-src="compositions/frames/06-lesson.html" data-start="50.38" data-duration="10.76" data-track-index="1"></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () { var tl = window.__timelines["main"];
        // 1→2 crossfade (0.5s overlap)
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 9.0);
        tl.fromTo("#el-02-origin", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 9.0);
        // 2→3 crossfade
        tl.to("#el-02-origin", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 18.66);
        tl.fromTo("#el-03-mechanism", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 18.66);
        // 3→4 crossfade
        tl.to("#el-03-mechanism", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 30.3);
        tl.fromTo("#el-04-cascade", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 30.3);
        // 4→5 crossfade
        tl.to("#el-04-cascade", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 43.78);
        tl.fromTo("#el-05-reframe", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 43.78);
        // 5→6 crossfade
        tl.to("#el-05-reframe", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 50.38);
        tl.fromTo("#el-06-lesson", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 50.38);
        // full-span anchor
        tl.to({}, { duration: 61.14 }, 0);
      })();
    </script>
  </body>
</html>
