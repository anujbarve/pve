<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Emotional Redlining — Jack Butcher Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000000;
        overflow: hidden;
      }
      #root {
        width: 1080px;
        height: 1920px;
        position: relative;
        overflow: hidden;
        background: #000000;
      }
      .film-shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div
      data-hf-id="root"
      id="root"
      data-composition-id="emotional-redlining-main"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="53.36"
    >
      <!-- Diagram 01: Voice vs Reality (0.00s - 6.16s) -->
      <div
        data-hf-id="s01"
        id="s01"
        class="clip film-shot"
        data-composition-id="shot-01-voice-vs-reality"
        data-composition-src="compositions/frames/shot-01-voice-vs-reality.html"
        data-start="0.00"
        data-duration="6.16"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 02: Comparison Illusion (6.16s - 12.80s) -->
      <div
        data-hf-id="s02"
        id="s02"
        class="clip film-shot"
        data-composition-id="shot-02-comparison-illusion"
        data-composition-src="compositions/frames/shot-02-comparison-illusion.html"
        data-start="6.16"
        data-duration="6.64"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 03: Ghost & Masking (12.80s - 19.80s) -->
      <div
        data-hf-id="s03"
        id="s03"
        class="clip film-shot"
        data-composition-id="shot-03-ghost-masking"
        data-composition-src="compositions/frames/shot-03-ghost-masking.html"
        data-start="12.80"
        data-duration="7.00"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 04: Stress Redline (19.80s - 26.80s) -->
      <div
        data-hf-id="s04"
        id="s04"
        class="clip film-shot"
        data-composition-id="shot-04-stress-redline"
        data-composition-src="compositions/frames/shot-04-stress-redline.html"
        data-start="19.80"
        data-duration="7.00"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 05: Circuit Breaker (26.80s - 34.40s) -->
      <div
        data-hf-id="s05"
        id="s05"
        class="clip film-shot"
        data-composition-id="shot-05-circuit-breaker"
        data-composition-src="compositions/frames/shot-05-circuit-breaker.html"
        data-start="26.80"
        data-duration="7.60"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 06: Worth != Output (34.40s - 43.04s) -->
      <div
        data-hf-id="s06"
        id="s06"
        class="clip film-shot"
        data-composition-id="shot-06-worth-output"
        data-composition-src="compositions/frames/shot-06-worth-output.html"
        data-start="34.40"
        data-duration="8.64"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 07: Ceasefire & Reset (43.04s - 53.36s) -->
      <div
        data-hf-id="s07"
        id="s07"
        class="clip film-shot"
        data-composition-id="shot-07-ceasefire-reset"
        data-composition-src="compositions/frames/shot-07-ceasefire-reset.html"
        data-start="43.04"
        data-duration="10.32"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Meditative Vocal-Forward Master Audio -->
      <audio
        data-hf-id="audio-master"
        id="audio-master"
        src=".temp_audio/master_sound_design.wav"
        data-start="0"
        data-duration="53.36"
        data-track-index="10"
        data-volume="1.0"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const masterTl = gsap.timeline({ paused: true });
      window.__timelines["emotional-redlining-main"] = masterTl;

      const s01 = document.getElementById("s01");
      const s02 = document.getElementById("s02");
      const s03 = document.getElementById("s03");
      const s04 = document.getElementById("s04");
      const s05 = document.getElementById("s05");
      const s06 = document.getElementById("s06");
      const s07 = document.getElementById("s07");

      // Crisp cuts between mental model diagrams
      masterTl.fromTo(s02, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 6.16);
      masterTl.fromTo(s03, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 12.80);
      masterTl.fromTo(s04, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 19.80);
      masterTl.fromTo(s05, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 26.80);
      masterTl.fromTo(s06, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 34.40);
      masterTl.fromTo(s07, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 43.04);
    </script>
  </body>
</html>
