<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root {
        position: relative; width: 1080px; height: 1920px;
        overflow: hidden; background: #000000;
      }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!--
      PROJECT NAME — N frames, ~XXs total
      Update data-duration on #root and each scene's data-start/data-duration.
    -->
    <div data-hf-id="hf-root" id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">

      <!-- Add scenes here. Example:
      <div data-hf-id="hf-s1" id="el-01" class="scene" data-composition-id="01-name" data-composition-src="compositions/frames/01-name.html" data-start="0" data-duration="6" data-track-index="0"></div>
      -->

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () { var tl = window.__timelines["main"];
        // Add crossfade transitions here. Example:
        // tl.to("#el-01", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 5.5);
        // tl.fromTo("#el-02", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 5.5);
        // full-span anchor
        tl.to({}, { duration: 30 }, 0);
      })();
    </script>
  </body>
</html>
