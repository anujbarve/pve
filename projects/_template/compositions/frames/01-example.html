  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <div data-hf-id="hf-01-root" id="root" data-composition-id="01-example" data-width="2160" data-height="3840" data-duration="8.0">
    <div data-hf-id="hf-01-ground" id="f01-ground" class="clip ground" data-start="0" data-duration="8.0" data-track-index="0">
      <div data-hf-id="hf-01-grid" id="f01-grid" class="bg-grid"></div>
    </div>

    <div data-hf-id="hf-01-frame" id="f01-frame" class="clip frame-container" data-start="0" data-duration="8.0" data-track-index="1">
      <div data-hf-id="hf-01-szone" class="safe-zone">
        
        <div data-hf-id="hf-01-stage" id="f01-stage" class="visual-stage">
          <div data-hf-id="hf-01-kicker" id="f01-kicker" class="kicker">FRAME KICKER</div>
          <h1 data-hf-id="hf-01-hl" id="f01-headline" class="headline">
            Hero Concept Headline <br><span class="highlight">Key Emphasis</span>
          </h1>
          <div data-hf-id="hf-01-div" id="f01-divider" class="divider-line"></div>

          <div data-hf-id="hf-01-call" id="f01-callout" class="callout-card">
            <span class="callout-text">Core Takeaway Insight</span>
          </div>
        </div>

        <!-- Dynamic Subtitle Captions -->
        <div data-hf-id="hf-01-capwrap" class="caption-wrapper" data-layout-allow-overlap>
          <div data-hf-id="hf-01-pill" id="f01-pill" class="caption-pill">
            <span data-hf-id="hf-01-cap" id="f01-caption" class="caption-text">Dynamic voiceover subtitle line.</span>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["01-example"] = tl;

    const kicker = document.getElementById("f01-kicker");
    const headline = document.getElementById("f01-headline");
    const divider = document.getElementById("f01-divider");
    const callout = document.getElementById("f01-callout");
    const capPill = document.getElementById("f01-pill");
    const capText = document.getElementById("f01-caption");

    // Initial states
    gsap.set(kicker, { opacity: 0, y: -20 });
    gsap.set(headline, { opacity: 0, y: 30 });
    gsap.set(divider, { scaleX: 0, opacity: 0 });
    gsap.set(callout, { opacity: 0, scale: 0.9, y: 30 });
    gsap.set(capPill, { opacity: 0, y: 20 });

    // Choreography timed to actual TTS audio
    tl.to(kicker, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.2);
    tl.to(headline, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.4);
    tl.to(divider, { opacity: 1, scaleX: 1, duration: 0.6, ease: "power2.out" }, 1.2);
    tl.to(callout, { opacity: 1, scale: 1, y: 0, duration: 0.8, ease: "back.out(1.4)" }, 3.5);

    // Dynamic Captions
    tl.to(capPill, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.4);
    tl.call(() => {
      capText.innerHTML = 'Dynamic voiceover <span class="cap-hl">subtitle line.</span>';
    }, null, 0.4);
  </script>
