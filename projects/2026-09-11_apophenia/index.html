<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Apophenia — Jack Butcher Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000000;
        overflow: hidden;
      }
      #root {
        width: 1080px;
        height: 1920px;
        position: relative;
        overflow: hidden;
        background: #000000;
      }
      .film-shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div
      data-hf-id="root"
      id="root"
      data-composition-id="apophenia-main"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="55.22"
    >
      <!-- Diagram 01: The Face in the Static (0.00s - 11.22s) -->
      <div
        data-hf-id="s01"
        id="s01"
        class="clip film-shot"
        data-composition-id="shot-01-static"
        data-composition-src="compositions/frames/shot-01-static.html"
        data-start="0.00"
        data-duration="11.22"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 02: The Pattern Detection Machine (11.22s - 19.16s) -->
      <div
        data-hf-id="s02"
        id="s02"
        class="clip film-shot"
        data-composition-id="shot-02-detection"
        data-composition-src="compositions/frames/shot-02-detection.html"
        data-start="11.22"
        data-duration="7.94"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 03: The Pareidolia Engine (19.16s - 32.38s) -->
      <div
        data-hf-id="s03"
        id="s03"
        class="clip film-shot"
        data-composition-id="shot-03-pareidolia"
        data-composition-src="compositions/frames/shot-03-pareidolia.html"
        data-start="19.16"
        data-duration="13.22"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 04: The Conspiracy Spiral (32.38s - 43.44s) -->
      <div
        data-hf-id="s04"
        id="s04"
        class="clip film-shot"
        data-composition-id="shot-04-conspiracy"
        data-composition-src="compositions/frames/shot-04-conspiracy.html"
        data-start="32.38"
        data-duration="11.06"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 05: The Epistemic Humility (43.44s - 55.22s) -->
      <div
        data-hf-id="s05"
        id="s05"
        class="clip film-shot"
        data-composition-id="shot-05-constellation"
        data-composition-src="compositions/frames/shot-05-constellation.html"
        data-start="43.44"
        data-duration="11.78"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Master Audio -->
      <audio
        data-hf-id="audio-master"
        id="audio-master"
        src=".temp_audio/master_sound_design.wav"
        data-start="0"
        data-duration="55.22"
        data-track-index="10"
        data-volume="1.0"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const masterTl = gsap.timeline({ paused: true });
      window.__timelines["apophenia-main"] = masterTl;

      const s01 = document.getElementById("s01");
      const s02 = document.getElementById("s02");
      const s03 = document.getElementById("s03");
      const s04 = document.getElementById("s04");
      const s05 = document.getElementById("s05");

      masterTl.fromTo(s02, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 11.22);
      masterTl.set(s01, { opacity: 0 }, 11.22);

      masterTl.fromTo(s03, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 19.16);
      masterTl.set(s02, { opacity: 0 }, 19.16);

      masterTl.fromTo(s04, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 32.38);
      masterTl.set(s03, { opacity: 0 }, 32.38);

      masterTl.fromTo(s05, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 43.44);
      masterTl.set(s04, { opacity: 0 }, 43.44);
    </script>
  </body>
</html>
