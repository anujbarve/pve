<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>The Paradox of Choice — Jack Butcher Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000000;
        overflow: hidden;
      }
      #root {
        width: 1080px;
        height: 1920px;
        position: relative;
        overflow: hidden;
        background: #000000;
      }
      .film-shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div
      data-hf-id="root"
      id="root"
      data-composition-id="paradox-of-choice-main"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="49.38"
    >
      <!-- Diagram 01: The Wall of Jars (0.00s - 10.98s) -->
      <div
        data-hf-id="s01"
        id="s01"
        class="clip film-shot"
        data-composition-id="shot-01-wall-of-jars"
        data-composition-src="compositions/frames/shot-01-wall-of-jars.html"
        data-start="0.00"
        data-duration="10.98"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 02: The Decision Freeze (10.98s - 20.28s) -->
      <div
        data-hf-id="s02"
        id="s02"
        class="clip film-shot"
        data-composition-id="shot-02-decision-freeze"
        data-composition-src="compositions/frames/shot-02-decision-freeze.html"
        data-start="10.98"
        data-duration="9.30"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 03: The Opportunity Cost Machine (20.28s - 30.78s) -->
      <div
        data-hf-id="s03"
        id="s03"
        class="clip film-shot"
        data-composition-id="shot-03-opportunity-cost"
        data-composition-src="compositions/frames/shot-03-opportunity-cost.html"
        data-start="20.28"
        data-duration="10.50"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 04: Maximizers vs Satisficers (30.78s - 42.72s) -->
      <div
        data-hf-id="s04"
        id="s04"
        class="clip film-shot"
        data-composition-id="shot-04-maximizer-satisficer"
        data-composition-src="compositions/frames/shot-04-maximizer-satisficer.html"
        data-start="30.78"
        data-duration="11.94"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 05: The Liberation (42.72s - 49.38s) -->
      <div
        data-hf-id="s05"
        id="s05"
        class="clip film-shot"
        data-composition-id="shot-05-liberation"
        data-composition-src="compositions/frames/shot-05-liberation.html"
        data-start="42.72"
        data-duration="6.66"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Master Audio -->
      <audio
        data-hf-id="audio-master"
        id="audio-master"
        src=".temp_audio/master_sound_design.wav"
        data-start="0"
        data-duration="49.38"
        data-track-index="10"
        data-volume="1.0"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const masterTl = gsap.timeline({ paused: true });
      window.__timelines["paradox-of-choice-main"] = masterTl;

      const s01 = document.getElementById("s01");
      const s02 = document.getElementById("s02");
      const s03 = document.getElementById("s03");
      const s04 = document.getElementById("s04");
      const s05 = document.getElementById("s05");

      masterTl.fromTo(s02, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 10.98);
      masterTl.fromTo(s03, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 20.28);
      masterTl.fromTo(s04, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 30.78);
      masterTl.fromTo(s05, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 42.72);
    </script>
  </body>
</html>
