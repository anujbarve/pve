    const tl = gsap.timeline({ paused: true });

    const env = document.getElementById("s01-env");
    const stage = document.getElementById("s01-stage");
    const doorRig = document.getElementById("s01-door-rig");
    const strangerA = document.getElementById("s01-stranger-a");
    const strangerB = document.getElementById("s01-stranger-b");
    const convoPulse = document.getElementById("s01-pulse");
    const caption = document.getElementById("s01-caption");
    const sub = document.getElementById("s01-sub");
    const glow = document.getElementById("s01-glow");

    gsap.set(strangerA, { opacity: 1, x: 0 });
