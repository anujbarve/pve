  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["shot-01-door"] = tl;

    const env = document.getElementById("s01-env");
    const stage = document.getElementById("s01-stage");
    const doorRig = document.getElementById("s01-door-rig");
    const strangerA = document.getElementById("s01-stranger-a");
    const strangerB = document.getElementById("s01-stranger-b");
    const convoPulse = document.getElementById("s01-pulse");
    const caption = document.getElementById("s01-caption");
    const sub = document.getElementById("s01-sub");
    const glow = document.getElementById("s01-glow");

    gsap.set(strangerA, { opacity: 1, x: 0 });
    gsap.set(strangerB, { opacity: 0, x: 0 });
    gsap.set(doorRig, { x: -350, opacity: 0 });
    gsap.set(stage, { scale: 0.95 });

    // Slow push-in on scene
    tl.to(stage, { scale: 1.04, duration: 9.62, ease: "power1.out" }, 0);
    tl.to(env, { scale: 1.06, duration: 9.62, ease: "none" }, 0);

    // Pulse animation across conversation beam
    tl.to(convoPulse, { x: 380, duration: 2.2, repeat: 3, ease: "linear" }, 0);

    // 4.6s: Door enters and sweeps across the interaction line
    tl.to(doorRig, { opacity: 1, duration: 0.4 }, 4.4);
    tl.to(doorRig, { x: 1200, duration: 3.4, ease: "power1.inOut" }, 4.5);

    // Swap occurs right behind the door at 6.0s
    tl.call(() => {
      caption.innerHTML = 'when a door passes—<span class="accent">swapping them with a total stranger</span>.';
      sub.innerText = 'The Swap (Simons & Levin 1998)';
    }, null, 5.0);

    tl.to(strangerA, { opacity: 0, duration: 0.1 }, 6.2);
    tl.to(strangerB, { opacity: 1, duration: 0.1 }, 6.2);
    tl.to(glow, { scale: 1.15, opacity: 1.0, duration: 1.5, ease: "power2.out" }, 6.2);
  </script>
