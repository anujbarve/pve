  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["shot-03-fovea"] = tl;

    const env = document.getElementById("s03-env");
    const stage = document.getElementById("s03-stage");
    const foveaBeam = document.getElementById("s03-fovea-beam");
    const targetReticle = document.getElementById("s03-target-reticle");
    const thumbCard = document.getElementById("s03-thumb-card");
    const caption = document.getElementById("s03-caption");
    const sub = document.getElementById("s03-sub");

    gsap.set(stage, { scale: 0.94 });
    gsap.set(thumbCard, { opacity: 0, x: 40 });
    gsap.set(targetReticle, { scale: 0.8, opacity: 0.7 });

    // Scene camera push-in
    tl.to(stage, { scale: 1.04, duration: 10.26, ease: "power1.out" }, 0);
    tl.to(env, { scale: 1.06, duration: 10.26, ease: "none" }, 0);

    // Foveal spotlight focus pulse
    tl.to(foveaBeam, { opacity: 0.95, duration: 1.5, yoyo: true, repeat: 3, ease: "power1.inOut" }, 0.5);
    tl.to(targetReticle, { scale: 1.05, opacity: 1, duration: 1.5, yoyo: true, repeat: 3, ease: "power1.inOut" }, 0.5);

    // 4.5s: "...confined to just two tiny degrees at the center"
    tl.call(() => {
      caption.innerHTML = 'Vision is confined to <span class="accent">just two tiny degrees</span>—the width of your thumbnail.';
      sub.innerText = 'The 2-Degree Fovea';
    }, null, 4.2);

    // Thumbnail scale card emerges at 5.5s
    tl.to(thumbCard, { opacity: 1, x: 0, duration: 0.8, ease: "back.out(1.4)" }, 5.2);
