  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["shot-05-summary"] = tl;

    const env = document.getElementById("s05-env");
    const stage = document.getElementById("s05-stage");
    const ringOuter = document.getElementById("s05-ring-outer");
    const ringInner = document.getElementById("s05-ring-inner");
    const card = document.getElementById("s05-card");
    const caption = document.getElementById("s05-caption");
    const sub = document.getElementById("s05-sub");

    gsap.set(stage, { scale: 0.92 });
    gsap.set(card, { opacity: 0, scale: 0.9 });
    gsap.set([ringOuter, ringInner], { opacity: 0, scale: 0.7 });

    // Cinematic wide pull-back
    tl.to(stage, { scale: 1.02, duration: 7.62, ease: "power1.out" }, 0);
    tl.to(env, { scale: 1.04, duration: 7.62, ease: "none" }, 0);

    // Golden rings expand smoothly
    tl.to([ringOuter, ringInner], { opacity: 1, scale: 1, duration: 1.6, ease: "back.out(1.4)" }, 0.4);
    tl.to(card, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 0.6);

    // Caption transition at 3.2s
    tl.call(() => {
      caption.innerHTML = 'you see a <span class="accent">fleeting summary</span> of what your brain assumes is still there.';
      sub.innerText = 'The Reality Illusion';
    }, null, 3.2);
  </script>
