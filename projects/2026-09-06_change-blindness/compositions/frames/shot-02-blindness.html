  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["shot-02-blindness"] = tl;

    const env = document.getElementById("s02-env");
    const stage = document.getElementById("s02-stage");
    const timerVal = document.getElementById("s02-timer-val");
    const gaugeFill = document.getElementById("s02-gauge-fill");
    const item1 = document.getElementById("s02-item-1");
    const item2 = document.getElementById("s02-item-2");
    const item3 = document.getElementById("s02-item-3");
    const nullBanner = document.getElementById("s02-null-banner");
    const caption = document.getElementById("s02-caption");
    const sub = document.getElementById("s02-sub");

    gsap.set(stage, { scale: 0.94 });
    gsap.set([item1, item2, item3, nullBanner], { opacity: 0, x: 30 });
    gsap.set(gaugeFill, { strokeDashoffset: 565 });

    // Scene slow camera drift
    tl.to(stage, { scale: 1.03, duration: 8.98, ease: "power1.out" }, 0);
    tl.to(env, { scale: 1.05, duration: 8.98, ease: "none" }, 0);

    // Gauge fills up smoothly
    tl.to(gaugeFill, { strokeDashoffset: 282, duration: 2.2, ease: "power2.out" }, 0.5);

    // Timer updates
    tl.call(() => { timerVal.innerText = "01:20"; }, null, 2.5);
    tl.call(() => { timerVal.innerText = "02:15"; }, null, 5.5);

    // Stagger in mismatch items
    tl.to(item1, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 1.2);
    tl.to(item2, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 2.4);
    tl.to(item3, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 3.6);
    tl.to(nullBanner, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 4.8);

    // Caption transition at 4.2s
    tl.call(() => {
      caption.innerHTML = 'continuing for minutes without realizing <span class="accent">they are talking to an entirely new face</span>.';
      sub.innerText = 'Unconscious Continuity';
    }, null, 4.0);
