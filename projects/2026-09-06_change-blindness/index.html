<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Change Blindness — Jack Butcher Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000000;
        overflow: hidden;
      }
      #root {
        width: 1080px;
        height: 1920px;
        position: relative;
        overflow: hidden;
        background: #000000;
      }
      .film-shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div
      data-hf-id="root"
      id="root"
      data-composition-id="change-blindness-main"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="44.66"
    >
      <!-- Shot 01: The Door Experiment (0.00s - 9.62s) -->
      <div
        data-hf-id="s01"
        id="s01"
        class="clip film-shot"
        data-composition-id="shot-01-door"
        data-composition-src="compositions/frames/shot-01-door.html"
        data-start="0.00"
        data-duration="9.62"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 02: The Blind Conversation (9.62s - 18.60s) -->
      <div
        data-hf-id="s02"
        id="s02"
        class="clip film-shot"
        data-composition-id="shot-02-blindness"
        data-composition-src="compositions/frames/shot-02-blindness.html"
        data-start="9.62"
        data-duration="8.98"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 03: The 2-Degree Fovea (18.60s - 28.86s) -->
      <div
        data-hf-id="s03"
        id="s03"
        class="clip film-shot"
        data-composition-id="shot-03-fovea"
        data-composition-src="compositions/frames/shot-03-fovea.html"
        data-start="18.60"
        data-duration="10.26"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 04: The Neural Reconstruction (28.86s - 37.04s) -->
      <div
        data-hf-id="s04"
        id="s04"
        class="clip film-shot"
        data-composition-id="shot-04-hallucination"
        data-composition-src="compositions/frames/shot-04-hallucination.html"
        data-start="28.86"
        data-duration="8.18"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 05: The Minimal Summary (37.04s - 44.66s) -->
      <div
        data-hf-id="s05"
        id="s05"
        class="clip film-shot"
        data-composition-id="shot-05-summary"
        data-composition-src="compositions/frames/shot-05-summary.html"
        data-start="37.04"
        data-duration="7.62"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Master 3-Layer Audio Soundtrack -->
      <audio
        data-hf-id="audio-master"
        id="audio-master"
        src=".temp_audio/master_sound_design.wav"
        data-start="0"
        data-duration="44.66"
        data-track-index="10"
        data-volume="1.0"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const masterTl = gsap.timeline({ paused: true });
      window.__timelines["change-blindness-main"] = masterTl;

      const s01 = document.getElementById("s01");
      const s02 = document.getElementById("s02");
      const s03 = document.getElementById("s03");
      const s04 = document.getElementById("s04");
      const s05 = document.getElementById("s05");

      // Crisp cuts between mental model diagrams
      masterTl.fromTo(s02, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 9.62);
      masterTl.fromTo(s03, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 18.60);
      masterTl.fromTo(s04, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 28.86);
      masterTl.fromTo(s05, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 37.04);
    </script>
  </body>
</html>
