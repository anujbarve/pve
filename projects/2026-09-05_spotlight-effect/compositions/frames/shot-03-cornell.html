  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["shot-03-cornell"] = tl;

    const env = document.getElementById("s03-env");
    const stage = document.getElementById("s03-stage");
    const barPred = document.getElementById("s03-bar-pred");
    const barAct = document.getElementById("s03-bar-act");
    const valPred = document.getElementById("s03-val-pred");
    const valAct = document.getElementById("s03-val-act");
    const gap = document.getElementById("s03-gap");
    const caption = document.getElementById("s03-caption");
    const sub = document.getElementById("s03-sub");

    gsap.set(gap, { scale: 0.5, opacity: 0 });
    gsap.set(stage, { scale: 0.94 });

    tl.to(env, { scale: 1.05, duration: 11.06, ease: "none" }, 0);
    tl.to(stage, { scale: 1.03, duration: 11.06, ease: "power1.out" }, 0);

    // Predicted 50% bar grows at 2.0s
    tl.to(barPred, { height: "75%", duration: 1.8, ease: "power2.out" }, 2.0);
    tl.to({ val: 0 }, {
      val: 50,
      duration: 1.8,
      ease: "power2.out",
      onUpdate: function() {
        valPred.innerText = Math.round(this.targets()[0].val) + "%";
      }
    }, 2.0);

    // 5.5s: "...predicted 50% noticed—yet barely 23% ever even glanced."

      caption.innerHTML = 'predicted <span class="accent">50% noticed</span>—yet barely <span class="accent">23% ever glanced</span>.';
      sub.innerText = '03 / The Spotlight Effect (Gilovich et al.)';
    }, null, 5.5);

    // Actual 23% bar grows at 5.5s

    tl.to({ val: 0 }, {
      val: 23,
      duration: 1.6,
      ease: "power2.out",
      onUpdate: function() {
        valAct.innerText = Math.round(this.targets()[0].val) + "%";
      }
