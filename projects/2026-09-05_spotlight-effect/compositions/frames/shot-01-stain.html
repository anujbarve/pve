  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["shot-01-stain"] = tl;

    const env = document.getElementById("s01-env");
    const stage = document.getElementById("s01-stage");
    const cone = document.getElementById("s01-cone");
    const glare = document.getElementById("s01-glare");
    const ring = document.getElementById("s01-ring");
    const wattVal = document.getElementById("s01-watt-val");
    const wattBar = document.getElementById("s01-watt-bar");
    const caption = document.getElementById("s01-caption");
    const sub = document.getElementById("s01-sub");

    gsap.set(cone, { opacity: 0.1, scale: 0.9 });
    gsap.set(glare, { opacity: 0, scale: 0.5 });
    gsap.set(ring, { opacity: 0.3, scale: 0.8, rotation: 0 });
    gsap.set(stage, { scale: 0.94 });

    // Smooth forward push-in
    tl.to(env, { scale: 1.06, duration: 9.62, ease: "none" }, 0);
    tl.to(stage, { scale: 1.04, duration: 9.62, ease: "power1.out" }, 0);
    tl.to(ring, { rotation: 180, duration: 9.62, ease: "none" }, 0);

    // 4.2s: Spotlight flares down ("feeling a blinding 10,000-watt spotlight burning directly into your chest")

      caption.innerHTML = 'feeling a blinding <span class="accent">10,000-watt spotlight</span> burning into your chest.';
      sub.innerText = '01 / The 10,000-Watt Stain';
      wattVal.innerText = '10,000 W';
      gsap.fromTo(wattVal, { color: "#FFF" }, { color: "#F2D24B", duration: 0.4 });
