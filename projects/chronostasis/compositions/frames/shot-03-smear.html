<template>
  <style>
    @font-face {
      font-family: "Playfair Display";
      font-style: normal;
      font-weight: 400 900;
      src: url(https://fonts.gstatic.com/s/playfairdisplay/v40/nuFiD-vYSZviVYUb_rj3ij__anPXDTzYgEM86xQ.woff2) format("woff2");

    @font-face {

    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    #root {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      background: #080808;
      font-family: "Inter", sans-serif;
      color: #F2F1EC;
    }

    .film-env {
      position: absolute;
      inset: -40px;
      background: 
        radial-gradient(circle at 50% 40%, rgba(212, 98, 43, 0.15) 0%, transparent 60%),
        linear-gradient(180deg, #100b08 0%, #050505 100%);
    }

    .scene-viewport {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .blur-stage {
      position: relative;
      width: 820px;
      height: 520px;
      margin-top: -120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .blur-streak-box {
      position: absolute;
      width: 780px;
      height: 320px;
      border: 1px solid rgba(212, 98, 43, 0.3);
      border-radius: 8px;
      background: rgba(18, 12, 8, 0.9);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .smear-lines {
      position: absolute;
      width: 1200px;
      height: 100%;
      background: repeating-linear-gradient(
        90deg,
        rgba(212, 98, 43, 0.4) 0px,
        rgba(242, 210, 75, 0.4) 30px,
        rgba(212, 98, 43, 0.1) 60px,
        transparent 90px
      );
      filter: blur(12px);
    }

    .shutter-blade {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 6px;
      background: #F2D24B;
      box-shadow: 0 0 20px #F2D24B;
      left: 0;
    }

    .blur-label {
      position: absolute;
      top: -36px;
      font-family: "Inter", sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: #D4622B;
      text-transform: uppercase;
    }

    .film-caption-block {
      position: absolute;
      bottom: 480px;
      left: 100px;
      right: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .caption-line {
      font-family: "Playfair Display", serif;
      font-size: 44px;
      font-weight: 700;
      line-height: 1.25;

    .caption-line .accent {
      color: #D4622B;
      font-style: italic;

    .caption-sub {
      font-family: "Inter", sans-serif;

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <div data-hf-id="hf-s03-root" id="root" data-composition-id="shot-03-smear" data-width="1080" data-height="1920" data-duration="7.30">
    <div data-hf-id="hf-s03-env" id="s03-env" class="film-env" data-layout-allow-overflow></div>

    <div class="scene-viewport">
      <div data-hf-id="hf-s03-stage" id="s03-stage" class="blur-stage">
        <div class="blur-label">RAW UNFILTERED OPTICAL STREAM</div>
        <div class="blur-streak-box">
          <div data-hf-id="hf-s03-smear" id="s03-smear" class="smear-lines" data-layout-allow-overflow></div>
          <div data-hf-id="hf-s03-blade" id="s03-blade" class="shutter-blade"></div>
        </div>
      </div>

      <!-- Subtitle -->
      <div data-hf-id="hf-s03-capwrap" class="film-caption-block" data-layout-allow-overlap>
        <p data-hf-id="hf-s03-line" id="s03-caption" class="caption-line">Without this blackout...</p>
        <span data-hf-id="hf-s03-sub" id="s03-sub" class="caption-sub">Optical Velocity Blur</span>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["shot-03-smear"] = tl;

    const env = document.getElementById("s03-env");
    const stage = document.getElementById("s03-stage");
    const smear = document.getElementById("s03-smear");
    const blade = document.getElementById("s03-blade");
    const caption = document.getElementById("s03-caption");
    const sub = document.getElementById("s03-sub");

    gsap.set(smear, { x: -200 });
    gsap.set(blade, { opacity: 0, x: 0 });

    tl.to(env, { scale: 1.05, duration: 7.30, ease: "none" }, 0);
    tl.to(stage, { scale: 1.02, duration: 7.30, ease: "power1.out" }, 0);

    // Violent motion smear sweep
    tl.to(smear, { x: 200, duration: 2.5, ease: "none", repeat: 1, yoyo: true }, 0);

    // 3.2s: "would produce a nauseating smear of motion blur."
    tl.call(() => {
      caption.innerHTML = 'every eye shift would be a <span class="accent">nauseating smear</span> of blur.';
      sub.innerHTML = 'Saccadic Blur Suppression';
    }, null, 2.8);

    // Shutter blade cuts the smear at 4.2s
    tl.to(blade, { opacity: 1, duration: 0.1 }, 4.0);
    tl.to(blade, { x: 780, duration: 1.2, ease: "power2.inOut" }, 4.1);
    tl.to(smear, { opacity: 0.1, duration: 1.0, ease: "power2.out" }, 4.3);
  </script>
</template>
