  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <div data-hf-id="hf-s01-root" id="root" data-composition-id="shot-01-command" data-width="1080" data-height="1920" data-duration="10.26">
    <div data-hf-id="hf-s01-env" id="s01-env" class="film-env" data-layout-allow-overflow></div>
    <div data-hf-id="hf-s01-floor" id="s01-floor" class="lab-floor" data-layout-allow-overflow></div>

    <div class="stage-center">
      <!-- Metadata chips -->
      <div data-hf-id="hf-s01-hud" id="s01-hud" class="lab-hud" data-layout-allow-overlap>
        <div class="hud-chip">
          <span class="hud-title">EXPERIMENT PROTOCOL</span>
          <span class="hud-val">Tachistoscope Flash</span>
        </div>
        <div class="hud-chip">
          <span class="hud-title">TARGET CORTEX</span>
          <span class="hud-val">Right Hemisphere</span>
        </div>
      </div>

      <!-- Tachistoscope Visual Split Screen -->
      <div data-hf-id="hf-s01-stage" id="s01-stage" class="tachistoscope-stage" data-layout-allow-overlap>
        <div class="field-partition" data-layout-allow-overlap>
          <div class="field-left" data-layout-allow-overlap>
            <span class="field-tag tag-left">Left Field &rarr; Right Brain</span>
            <div id="s01-flash" class="flash-word" data-layout-allow-overlap>WALK</div>
          </div>
          <div class="field-right" data-layout-allow-overlap>
            <span class="field-tag tag-right">Right Field &rarr; Left Brain</span>
            <div class="blank-placeholder">[ BLANK ]</div>
          </div>
        </div>

        <!-- Optical Retinal Split Vector Paths -->
        <svg class="optic-pathway-svg" viewBox="0 0 580 220" fill="none" data-layout-allow-overlap>
          <path id="s01-path-left" d="M 140 10 C 140 100, 380 120, 420 200" stroke="#F2D24B" stroke-width="3" stroke-dasharray="6 6" opacity="0.4" />
          <path id="s01-path-right" d="M 440 10 C 440 100, 180 120, 160 200" stroke="#A0A09C" stroke-width="2" stroke-dasharray="4 4" opacity="0.2" />
          <circle id="s01-pulse-node" cx="420" cy="200" r="8" fill="#F2D24B" opacity="0" />
        </svg>

        <!-- Stepping Footstep Coordinates -->
        <div data-hf-id="hf-s01-feet" class="footstep-track" data-layout-allow-overlap>
          <div id="s01-step1" class="step-node" data-layout-allow-overlap>
            <span class="step-label">Step 01</span>
            <span class="step-time">t = +0.8s</span>
          </div>
          <div id="s01-step2" class="step-node" data-layout-allow-overlap>
            <span class="step-label">Step 02</span>
            <span class="step-time">t = +1.6s</span>
          </div>
          <div id="s01-step3" class="step-node" data-layout-allow-overlap>

        <span data-hf-id="hf-s01-sub" id="s01-sub" class="caption-sub">The Split-Brain Experiment (1977)</span>
      </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["shot-01-command"] = tl;

    const env = document.getElementById("s01-env");
    const stage = document.getElementById("s01-stage");
    const flash = document.getElementById("s01-flash");
    const pulseNode = document.getElementById("s01-pulse-node");
    const step1 = document.getElementById("s01-step1");
    const step2 = document.getElementById("s01-step2");
    const step3 = document.getElementById("s01-step3");
    const caption = document.getElementById("s01-caption");
    const sub = document.getElementById("s01-sub");

    gsap.set(flash, { opacity: 0, scale: 0.8 });
    gsap.set([step1, step2, step3], { opacity: 0, y: 30 });
    gsap.set(pulseNode, { opacity: 0, scale: 0.5 });
    gsap.set(stage, { scale: 0.95 });

    // Continuous camera push
    tl.to(env, { scale: 1.05, duration: 10.26, ease: "none" }, 0);
    tl.to(stage, { scale: 1.02, duration: 10.26, ease: "power1.out" }, 0);

    // 0.4s: Tachistoscope flash of "WALK"
    tl.to(flash, { opacity: 1, scale: 1.08, duration: 0.25, ease: "power2.out" }, 0.4);
    tl.to(flash, { scale: 1.0, duration: 0.4, ease: "power1.inOut" }, 0.65);
    tl.to(pulseNode, { opacity: 1, scale: 1.4, duration: 0.5, ease: "back.out(2)" }, 1.0);

    // 5.4s: Second half of sentence: "...the patient stood up and began walking."
    tl.call(() => {
      caption.innerHTML = '...the patient <span class="accent">stood up and began walking</span>.';
      sub.innerText = 'Immediate Motor Execution';
    }, null, 5.4);

    // Stepping footprint nodes light up sequentially
    tl.to(step1, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 5.8);
    tl.to(step2, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 6.8);
    tl.to(step3, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 7.8);
  </script>
