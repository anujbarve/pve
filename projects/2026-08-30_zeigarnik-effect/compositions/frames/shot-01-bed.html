  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <div data-hf-id="hf-s01-root" id="root" data-composition-id="shot-01-bed" data-width="1080" data-height="1920" data-duration="6.66">
    <div data-hf-id="hf-s01-env" id="s01-env" class="film-env" data-layout-allow-overflow></div>

    <div class="scene-viewport">
      <div data-hf-id="hf-s01-stage" id="s01-stage" class="insomnia-stage">
        <div class="ceiling-ambient-ring"></div>
        <div data-hf-id="hf-s01-clock" id="s01-clock" class="insomnia-clock">3:14 AM • Midnight Loop</div>

        <div data-hf-id="hf-s01-wave1" id="s01-wave1" class="neural-wave"></div>
        <div data-hf-id="hf-s01-wave2" id="s01-wave2" class="neural-wave"></div>

        <div data-hf-id="hf-s01-draft" id="s01-draft" class="draft-hologram">
          <div class="draft-header">
            <span class="draft-tag">Unsent Draft • 3:00 PM</span>
            <span class="draft-time">Pending Closure</span>
          </div>
          <div class="draft-title">Regarding the final proposal...</div>
          <div class="draft-body">
            "I wanted to follow up on the missing data before we proceed with the launch..."<span id="s01-cursor" class="draft-cursor"></span>
          </div>
        </div>
      </div>

      <!-- Subtitles -->
      <div data-hf-id="hf-s01-capwrap" class="film-caption-block" data-layout-allow-overlap>
        <p data-hf-id="hf-s01-line" id="s01-caption" class="caption-line">You lie in bed trying to sleep...</p>
        <span data-hf-id="hf-s01-sub" id="s01-sub" class="caption-sub">The Nocturnal Intrusive Loop</span>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["shot-01-bed"] = tl;

    const env = document.getElementById("s01-env");
    const stage = document.getElementById("s01-stage");
    const draft = document.getElementById("s01-draft");
    const wave1 = document.getElementById("s01-wave1");
    const wave2 = document.getElementById("s01-wave2");
    const caption = document.getElementById("s01-caption");
    const sub = document.getElementById("s01-sub");
    const cursor = document.getElementById("s01-cursor");

    gsap.set(draft, { scale: 0.95, opacity: 0.85 });
    gsap.set(stage, { scale: 0.96 });

    // Camera push-in
    tl.to(env, { scale: 1.06, duration: 6.66, ease: "none" }, 0);
    tl.to(stage, { scale: 1.03, duration: 6.66, ease: "power1.out" }, 0);

    // Blinking cursor
    tl.to(cursor, { opacity: 0, repeat: 10, yoyo: true, duration: 0.35, ease: "steps(1)" }, 0);

    // 3.2s: "replaying a single unfinished email from three P M"
    tl.call(() => {
      caption.innerHTML = 'obsessively replaying an <span class="accent">unfinished email</span> from 3 PM.';
      sub.innerHTML = 'The Open Working Loop';
    }, null, 3.2);

    // Neural waves pulsing outward
    tl.fromTo(wave1, { scale: 0.8, opacity: 0.7 }, { scale: 1.5, opacity: 0, duration: 2.2, ease: "power2.out" }, 3.2);
    tl.fromTo(wave2, { scale: 0.8, opacity: 0.7 }, { scale: 1.5, opacity: 0, duration: 2.2, ease: "power2.out" }, 4.2);

    // Draft glow intensifies
    tl.to(draft, {
      borderColor: "rgba(242, 210, 75, 0.8)",
      boxShadow: "0 25px 100px rgba(0, 0, 0, 0.9), 0 0 50px rgba(242, 210, 75, 0.4)",
      duration: 1.5,
      ease: "power2.out"
    }, 3.2);
