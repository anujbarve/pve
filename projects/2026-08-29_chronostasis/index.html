<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Chronostasis — The Stopped-Clock Illusion</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Playfair Display";
        font-style: normal;
        font-weight: 400 900;
        src: url(https://fonts.gstatic.com/s/playfairdisplay/v40/nuFiD-vYSZviVYUb_rj3ij__anPXDTzYgEM86xQ.woff2) format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000000;
        overflow: hidden;
      }
      #root {
        width: 1080px;
        height: 1920px;
        position: relative;
        overflow: hidden;
        background: #000000;
      }
      .film-shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div
      data-hf-id="root"
      id="root"
      data-composition-id="chronostasis-main"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="33.78"
    >
      <!-- Shot 01: The Glanced Clock (0.00s - 6.10s) -->
      <div
        data-hf-id="s01"
        id="s01"
        class="clip film-shot"
        data-composition-id="shot-01-clock"
        data-composition-src="compositions/frames/shot-01-clock.html"
        data-start="0.00"
        data-duration="6.10"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 02: The Saccade Gap (6.10s - 12.60s) -->
      <div
        data-hf-id="s02"
        id="s02"
        class="clip film-shot"
        data-composition-id="shot-02-saccade"
        data-composition-src="compositions/frames/shot-02-saccade.html"
        data-start="6.10"
        data-duration="6.50"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 03: The Motion Blur Delete (12.60s - 19.90s) -->
      <div
        data-hf-id="s03"
        id="s03"
        class="clip film-shot"
        data-composition-id="shot-03-smear"
        data-composition-src="compositions/frames/shot-03-smear.html"
        data-start="12.60"
        data-duration="7.30"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 04: The Retroactive Stitch (19.90s - 26.64s) -->
      <div
        data-hf-id="s04"
        id="s04"
        class="clip film-shot"
        data-composition-id="shot-04-rewind"
        data-composition-src="compositions/frames/shot-04-rewind.html"
        data-start="19.90"
        data-duration="6.74"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 05: The Edited Reality (26.64s - 33.78s) -->
      <div
        data-hf-id="s05"
        id="s05"
        class="clip film-shot"
        data-composition-id="shot-05-edited"
        data-composition-src="compositions/frames/shot-05-edited.html"
        data-start="26.64"
        data-duration="7.14"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Master 3-Layer Audio Soundtrack (VO + BGM + SFX) -->
      <audio
        data-hf-id="audio-master"
        id="audio-master"
        src=".temp_audio/master_sound_design.wav"
        data-start="0"
        data-duration="33.78"
        data-track-index="10"
        data-volume="1.0"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const masterTl = gsap.timeline({ paused: true });
      window.__timelines["chronostasis-main"] = masterTl;

      const s01 = document.getElementById("s01");
      const s02 = document.getElementById("s02");
      const s03 = document.getElementById("s03");
      const s04 = document.getElementById("s04");
      const s05 = document.getElementById("s05");

      // Crossfades between shots
      masterTl.fromTo(s02, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 6.10);
      masterTl.to(s01, { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 6.10);

      masterTl.fromTo(s03, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 12.60);
      masterTl.to(s02, { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 12.60);

      masterTl.fromTo(s04, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 19.90);
      masterTl.to(s03, { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 19.90);

      masterTl.fromTo(s05, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 26.64);
      masterTl.to(s04, { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 26.64);
    </script>
  </body>
</html>
