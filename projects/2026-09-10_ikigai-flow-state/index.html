<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Flow State & Ikigai — Jack Butcher Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000000;
        overflow: hidden;
      }
      #root {
        width: 1080px;
        height: 1920px;
        position: relative;
        overflow: hidden;
        background: #000000;
      }
      .film-shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div
      data-hf-id="root"
      id="root"
      data-composition-id="ikigai-flow-state-main"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="48.98"
    >
      <!-- Diagram 01: The Vanishing Clock (0.00s - 10.58s) -->
      <div
        data-hf-id="s01"
        id="s01"
        class="clip film-shot"
        data-composition-id="shot-01-vanishing-clock"
        data-composition-src="compositions/frames/shot-01-vanishing-clock.html"
        data-start="0.00"
        data-duration="10.58"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 02: The Challenge-Skill Balance (10.58s - 18.60s) -->
      <div
        data-hf-id="s02"
        id="s02"
        class="clip film-shot"
        data-composition-id="shot-02-challenge-skill"
        data-composition-src="compositions/frames/shot-02-challenge-skill.html"
        data-start="10.58"
        data-duration="8.02"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 03: Transient Hypofrontality (18.60s - 29.58s) -->
      <div
        data-hf-id="s03"
        id="s03"
        class="clip film-shot"
        data-composition-id="shot-03-hypofrontality"
        data-composition-src="compositions/frames/shot-03-hypofrontality.html"
        data-start="18.60"
        data-duration="10.98"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 04: The Neurochemical Flood (29.58s - 40.80s) -->
      <div
        data-hf-id="s04"
        id="s04"
        class="clip film-shot"
        data-composition-id="shot-04-neurochemical"
        data-composition-src="compositions/frames/shot-04-neurochemical.html"
        data-start="29.58"
        data-duration="11.22"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 05: The Ikigai Anchor (40.80s - 48.98s) -->
      <div
        data-hf-id="s05"
        id="s05"
        class="clip film-shot"
        data-composition-id="shot-05-ikigai"
        data-composition-src="compositions/frames/shot-05-ikigai.html"
        data-start="40.80"
        data-duration="8.18"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Master Audio -->
      <audio
        data-hf-id="audio-master"
        id="audio-master"
        src=".temp_audio/master_sound_design.wav"
        data-start="0"
        data-duration="48.98"
        data-track-index="10"
        data-volume="1.0"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const masterTl = gsap.timeline({ paused: true });
      window.__timelines["ikigai-flow-state-main"] = masterTl;

      const s01 = document.getElementById("s01");
      const s02 = document.getElementById("s02");
      const s03 = document.getElementById("s03");
      const s04 = document.getElementById("s04");
      const s05 = document.getElementById("s05");

      masterTl.fromTo(s02, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 10.58);
      masterTl.set(s01, { opacity: 0 }, 10.58);

      masterTl.fromTo(s03, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 18.60);
      masterTl.set(s02, { opacity: 0 }, 18.60);

      masterTl.fromTo(s04, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 29.58);
      masterTl.set(s03, { opacity: 0 }, 29.58);

      masterTl.fromTo(s05, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 40.80);
      masterTl.set(s04, { opacity: 0 }, 40.80);
    </script>
  </body>
</html>
