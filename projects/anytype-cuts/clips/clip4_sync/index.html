<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Clip 4: Local Network Direct Sync</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2) format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000000;
        color: #ffffff;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
        width: 1920px;
        height: 1080px;
      }
      #root {
        width: 1920px;
        height: 1080px;
        position: relative;
        background: #000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px;
      }
      .badge {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #888890;
        border: 1px solid #33333a;
        padding: 8px 24px;
        border-radius: 999px;
        margin-bottom: 24px;
        opacity: 0;
        transform: translateY(10px);
      }
      .title {
        font-size: 56px;
        font-weight: 900;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        text-align: center;
        margin-bottom: 60px;
        opacity: 0;
        transform: translateY(20px);
      }
      .sync-box {
        width: 1100px;
        background: #0a0a0e;
        border: 2px solid #ffffff;
        border-radius: 20px;
        padding: 48px 60px;
        display: flex;
        flex-direction: column;
        gap: 36px;
        opacity: 0;
        transform: translateY(30px);
      }
      .devices-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .device {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .device-icon {
        width: 64px;
        height: 64px;
        border: 2px solid #ffffff;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: 900;
      }
      .device-info {
        display: flex;
        flex-direction: column;
      }
      .device-name {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.05em;
      }
      .device-status {
        font-size: 14px;
        color: #888890;
        font-weight: 600;
      }
      .sync-pulse {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        flex: 1;
        padding: 0 40px;
      }
      .sync-tag {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.2em;
        color: #ffffff;
        background: #181820;
        padding: 6px 18px;
        border: 1px solid #444450;
        border-radius: 999px;
      }
      .sync-bar {
        width: 100%;
        height: 4px;
        background: #ffffff;
        border-radius: 2px;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
        border-top: 1px solid #222228;
        padding-top: 28px;
      }
      .stat-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .stat-label {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.15em;
        color: #666670;
        text-transform: uppercase;
      }
      .stat-val {
        font-size: 20px;
        font-weight: 800;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div
      data-hf-id="root"
      id="root"
      data-composition-id="clip4-sync"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="14"
    >
      <div class="badge" id="badge">LOCAL MESH NETWORK</div>
      <h1 class="title" id="title">INSTANT LOCAL DEVICE HANDSHAKE</h1>

      <div class="sync-box" id="syncBox">
        <div class="devices-row">
          <div class="device">
            <div class="device-icon">MAC</div>
            <div class="device-info">
              <div class="device-name">HOST DESKTOP</div>
              <div class="device-status">Local SQLite Engine</div>
            </div>
          </div>

          <div class="sync-pulse" id="pulse">
            <div class="sync-tag">1 DEVICE CONNECTED • LAN SYNC</div>
            <div class="sync-bar"></div>
          </div>

          <div class="device">
            <div class="device-icon">AND</div>
            <div class="device-info">
              <div class="device-name">ANDROID CLIENT</div>
              <div class="device-status">Direct Local Peer</div>
            </div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-label">Latency</div>
            <div class="stat-val">&lt; 10ms (Local Wi-Fi)</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Cloud Middleman</div>
            <div class="stat-val">None (Zero Cloud Calls)</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Bandwidth Cost</div>
            <div class="stat-val">$0.00 / Unlimited</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["clip4-sync"] = tl;

      tl.to("#badge", { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.4)
        .to("#title", { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.8)
        .to("#syncBox", { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 1.6)
        .from("#pulse", { scaleX: 0.8, opacity: 0.5, duration: 0.6, repeat: 3, yoyo: true }, 2.2);
    </script>
  </body>
</html>
