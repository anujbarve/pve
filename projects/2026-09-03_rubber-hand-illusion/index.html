<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>The Rubber Hand Illusion — Jack Butcher Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000000;
        overflow: hidden;
      }
      #root {
        width: 1080px;
        height: 1920px;
        position: relative;
        overflow: hidden;
        background: #000000;
      }
      .film-shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div
      data-hf-id="root"
      id="root"
      data-composition-id="rubber-hand-main"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="48.90"
    >
      <!-- Shot 01: The Sensory Decoupling (0.00s - 8.74s) -->
      <div
        data-hf-id="s01"
        id="s01"
        class="clip film-shot"
        data-composition-id="shot-01-setup"
        data-composition-src="compositions/frames/shot-01-setup.html"
        data-start="0.00"
        data-duration="8.74"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 02: Synchronous Tactile Binding (8.74s - 18.60s) -->
      <div
        data-hf-id="s02"
        id="s02"
        class="clip film-shot"
        data-composition-id="shot-02-sync"
        data-composition-src="compositions/frames/shot-02-sync.html"
        data-start="8.74"
        data-duration="9.86"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 03: Body Ownership Plasticity (18.60s - 28.46s) -->
      <div
        data-hf-id="s03"
        id="s03"
        class="clip film-shot"
        data-composition-id="shot-03-adoption"
        data-composition-src="compositions/frames/shot-03-adoption.html"
        data-start="18.60"
        data-duration="9.86"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 04: The Threat Reflex (28.46s - 39.92s) -->
      <div
        data-hf-id="s04"
        id="s04"
        class="clip film-shot"
        data-composition-id="shot-04-strike"
        data-composition-src="compositions/frames/shot-04-strike.html"
        data-start="28.46"
        data-duration="11.46"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 05: The Fragility of Self (39.92s - 48.90s) -->
      <div
        data-hf-id="s05"
        id="s05"
        class="clip film-shot"
        data-composition-id="shot-05-plasticity"
        data-composition-src="compositions/frames/shot-05-plasticity.html"
        data-start="39.92"
        data-duration="8.98"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Master Audio Track -->
      <audio
        data-hf-id="audio-master"
        id="audio-master"
        src=".temp_audio/master_sound_design.wav"
        data-start="0"
        data-duration="48.90"
        data-track-index="10"
        data-volume="1.0"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const masterTl = gsap.timeline({ paused: true });
      window.__timelines["rubber-hand-main"] = masterTl;

      const s01 = document.getElementById("s01");
      const s02 = document.getElementById("s02");
      const s03 = document.getElementById("s03");
      const s04 = document.getElementById("s04");
      const s05 = document.getElementById("s05");

      // Crisp cuts between mental model diagrams
      masterTl.fromTo(s02, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 8.74);
      masterTl.fromTo(s03, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 18.60);
      masterTl.fromTo(s04, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 28.46);
      masterTl.fromTo(s05, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 39.92);
    </script>
  </body>
</html>
