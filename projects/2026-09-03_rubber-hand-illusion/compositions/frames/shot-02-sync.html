  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["shot-02-sync"] = tl;

    const env = document.getElementById("s02-env");
    const stage = document.getElementById("s02-stage");
    const brushL = document.getElementById("s02-brush-left");
    const brushR = document.getElementById("s02-brush-right");
    const rippleL = document.getElementById("s02-ripple-l");
    const rippleR = document.getElementById("s02-ripple-r");
    const fusionBeam = document.getElementById("s02-fusion-beam");
    const statusTxt = document.getElementById("s02-status-txt");
    const caption = document.getElementById("s02-caption");
    const sub = document.getElementById("s02-sub");

    gsap.set(stage, { scale: 0.95 });
    gsap.set([brushL, brushR], { y: 0 });
    gsap.set([rippleL, rippleR], { scale: 0.5, opacity: 0 });
    gsap.set(fusionBeam, { scaleX: 0, opacity: 0 });

    // Smooth forward push
    tl.to(env, { scale: 1.05, duration: 9.86, ease: "none" }, 0);
    tl.to(stage, { scale: 1.02, duration: 9.86, ease: "power1.out" }, 0);

    // Stroke 1 (0.5s - 2.5s)
    tl.to([brushL, brushR], { y: 110, duration: 1.4, ease: "power1.inOut" }, 0.5);
    tl.fromTo([rippleL, rippleR], { opacity: 0.9, scale: 0.5 }, { opacity: 0, scale: 1.8, duration: 1.0, ease: "power2.out" }, 0.9);

    // Stroke 1 reset (2.5s - 3.5s)
    tl.to([brushL, brushR], { y: 0, duration: 1.0, ease: "power1.inOut" }, 2.2);

    // Stroke 2 (3.6s - 5.5s)
    tl.to([brushL, brushR], { y: 120, duration: 1.4, ease: "power1.inOut" }, 3.6);
    tl.fromTo([rippleL, rippleR], { opacity: 0.9, scale: 0.5 }, { opacity: 0, scale: 2.0, duration: 1.0, ease: "power2.out" }, 4.0);

    // 4.8s: "what your eyes see and what your skin feels fuse into a single neural event."
    tl.call(() => {
      caption.innerHTML = 'what your eyes see and skin feels <span class="accent">fuse into a single neural event</span>.';
      sub.innerText = 'Crossmodal Temporal Binding';
      statusTxt.innerText = 'CROSSMODAL FUSION ACTIVE';
      statusTxt.style.color = '#F2D24B';
    }, null, 4.8);

    // Crossmodal Fusion Beam Ignites
    tl.to(fusionBeam, { scaleX: 1, opacity: 1, duration: 0.8, ease: "back.out(1.4)" }, 5.0);

    // Stroke 3 (6.0s - 8.2s)
    tl.to([brushL, brushR], { y: 20, duration: 1.0, ease: "power1.inOut" }, 5.5);
    tl.to([brushL, brushR], { y: 130, duration: 1.4, ease: "power1.inOut" }, 6.6);
    tl.fromTo([rippleL, rippleR], { opacity: 1, scale: 0.5 }, { opacity: 0, scale: 2.2, duration: 1.0, ease: "power2.out" }, 7.0);
  </script>
