  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["shot-01-setup"] = tl;

    const env = document.getElementById("s01-env");
    const stage = document.getElementById("s01-stage");
    const divider = document.getElementById("s01-divider");
    const occlusion = document.getElementById("s01-occlusion");
    const reticle = document.getElementById("s01-reticle");
    const zoneRight = document.getElementById("s01-zone-right");
    const caption = document.getElementById("s01-caption");
    const sub = document.getElementById("s01-sub");
    const cone = document.getElementById("s01-cone");

    gsap.set(stage, { scale: 0.94, y: 10 });
    gsap.set(divider, { y: -30, opacity: 0.5 });
    gsap.set(occlusion, { opacity: 0 });
    gsap.set(reticle, { opacity: 0, scale: 1.15 });

    // Smooth forward push-in
    tl.to(env, { scale: 1.05, duration: 8.74, ease: "none" }, 0);
    tl.to(stage, { scale: 1.02, y: 0, duration: 8.74, ease: "power1.out" }, 0);

    // Divider locks into place

    tl.to(occlusion, { opacity: 1, duration: 1.2, ease: "power2.inOut" }, 1.4);

      sub.innerText = 'Visual Focus: Rubber Prosthesis';

    tl.to(zoneRight, { scale: 1.03, duration: 1.2, ease: "power2.out" }, 4.2);
