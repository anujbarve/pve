<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>London Taxi Hippocampus — Explainer Video</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Playfair Display";
        font-style: normal;
        font-weight: 400 900;
        src: url(https://fonts.gstatic.com/s/playfairdisplay/v40/nuFiD-vYSZviVYUb_rj3ij__anPXDTzYgEM86xQ.woff2) format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000000;
        overflow: hidden;
      }
      #root {
        width: 1080px;
        height: 1920px;
        position: relative;
        overflow: hidden;
        background: #000000;
      }
      .frame-track {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div
      data-hf-id="root"
      id="root"
      data-composition-id="london-taxi-hippocampus-main"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="66.98"
    >
      <!-- Frame 1: Hook -->
      <div
        data-hf-id="f01"
        id="f01"
        class="clip frame-track"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0.00"
        data-duration="12.94"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Frame 2: Origin -->
      <div
        data-hf-id="f02"
        id="f02"
        class="clip frame-track"
        data-composition-id="02-origin"
        data-composition-src="compositions/frames/02-origin.html"
        data-start="12.44"
        data-duration="10.62"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Frame 3: Mechanism -->
      <div
        data-hf-id="f03"
        id="f03"
        class="clip frame-track"
        data-composition-id="03-mechanism"
        data-composition-src="compositions/frames/03-mechanism.html"
        data-start="22.56"
        data-duration="13.82"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Frame 4: Cascade -->
      <div
        data-hf-id="f04"
        id="f04"
        class="clip frame-track"
        data-composition-id="04-cascade"
        data-composition-src="compositions/frames/04-cascade.html"
        data-start="35.88"
        data-duration="10.70"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Frame 5: Reframe -->
      <div
        data-hf-id="f05"
        id="f05"
        class="clip frame-track"
        data-composition-id="05-reframe"
        data-composition-src="compositions/frames/05-reframe.html"
        data-start="46.08"
        data-duration="11.58"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Frame 6: Lesson -->
      <div
        data-hf-id="f06"
        id="f06"
        class="clip frame-track"
        data-composition-id="06-lesson"
        data-composition-src="compositions/frames/06-lesson.html"
        data-start="57.16"
        data-duration="11.42"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Synced Narration Audio Track -->
      <audio
        data-hf-id="audio-narration"
        id="audio-narration"
        src=".temp_audio/narration_full.wav"
        data-start="0"
        data-duration="66.98"
        data-track-index="10"
        data-volume="1.0"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const masterTl = gsap.timeline({ paused: true });
      window.__timelines["london-taxi-hippocampus-main"] = masterTl;

      const f01 = document.getElementById("f01");
      const f02 = document.getElementById("f02");
      const f03 = document.getElementById("f03");
      const f04 = document.getElementById("f04");
      const f05 = document.getElementById("f05");
      const f06 = document.getElementById("f06");

      // Smooth crossfades at scene transitions (0.5s opacity ramps)
      masterTl.fromTo(f02, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.inOut" }, 12.44);
      masterTl.to(f01, { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 12.44);

      masterTl.fromTo(f03, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.inOut" }, 22.56);
      masterTl.to(f02, { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 22.56);

      masterTl.fromTo(f04, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.inOut" }, 35.88);
      masterTl.to(f03, { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 35.88);

      masterTl.fromTo(f05, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.inOut" }, 46.08);
      masterTl.to(f04, { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 46.08);

      masterTl.fromTo(f06, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.inOut" }, 57.16);
      masterTl.to(f05, { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 57.16);
    </script>
  </body>
</html>
