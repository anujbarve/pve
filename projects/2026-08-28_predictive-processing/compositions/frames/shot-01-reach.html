  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["shot-01-reach"] = tl;

    const env = document.getElementById("s01-env");
    const table = document.getElementById("s01-table");
    const stage = document.getElementById("s01-stage");
    const reachSolid = document.getElementById("s01-reach-solid");
    const targetDot = document.getElementById("s01-target-dot");
    const phantom = document.getElementById("s01-phantom");
    const phantomPulse = document.getElementById("s01-phantom-pulse");
    const caption = document.getElementById("s01-caption");
    const sub = document.getElementById("s01-sub");

    // Camera initial framing
    gsap.set(stage, { scale: 0.95, y: 30 });
    gsap.set(phantom, { opacity: 0, scale: 0.9 });
    gsap.set(targetDot, { opacity: 0 });

    // Slow cinematic camera track
    tl.to(env, { scale: 1.05, duration: 10.90, ease: "none" }, 0);
    tl.to(stage, { scale: 1.02, y: 0, duration: 10.90, ease: "power1.out" }, 0);

    // 0.3s - 3.8s: "Reach for your cup without looking."
    tl.to(reachSolid, { strokeDashoffset: 0, duration: 2.2, ease: "power2.out" }, 0.4);
    tl.to(targetDot, { opacity: 1, duration: 0.3 }, 2.0);

    // 3.8s - 7.2s: "Your fingers close on empty air."
    tl.call(() => {
      caption.innerHTML = 'Your fingers close on <span class="accent">empty air</span>.';
      sub.innerHTML = 'The Missing Target';
    }, null, 3.8);

    // Phantom cup materializes from the empty space
    tl.to(phantom, { opacity: 1, scale: 1, duration: 1.2, ease: "power3.out" }, 4.0);
    tl.fromTo(phantomPulse, { r: 20, opacity: 0.9 }, { r: 120, opacity: 0, duration: 1.8, repeat: 2, ease: "power2.out" }, 4.5);

    // 7.2s - 10.9s: "For a split second, your world glitches."
    tl.call(() => {
      caption.innerHTML = 'For a split second, your world <span class="accent">glitches</span>.';
      sub.innerHTML = 'Perceptual Mismatch';
    }, null, 7.2);

    tl.to(phantom, { x: 4, duration: 0.06, repeat: 7, yoyo: true, ease: "rough" }, 7.5);
