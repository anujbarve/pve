<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Predictive Processing — Cinematic Short Film</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Playfair Display";
        font-style: normal;
        font-weight: 400 900;
        src: url(https://fonts.gstatic.com/s/playfairdisplay/v40/nuFiD-vYSZviVYUb_rj3ij__anPXDTzYgEM86xQ.woff2) format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000000;
        overflow: hidden;
      }
      #root {
        width: 1080px;
        height: 1920px;
        position: relative;
        overflow: hidden;
        background: #000000;
      }
      .film-shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div
      data-hf-id="root"
      id="root"
      data-composition-id="predictive-processing-main"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="47.54"
    >
      <!-- Shot 01: The Blind Reach -->
      <div
        data-hf-id="s01"
        id="s01"
        class="clip film-shot"
        data-composition-id="shot-01-reach"
        data-composition-src="compositions/frames/shot-01-reach.html"
        data-start="0.00"
        data-duration="10.90"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 02: The Spatial Fracture -->
      <div
        data-hf-id="s02"
        id="s02"
        class="clip film-shot"
        data-composition-id="shot-02-fracture"
        data-composition-src="compositions/frames/shot-02-fracture.html"
        data-start="10.90"
        data-duration="8.66"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 03: The Projection Engine -->
      <div
        data-hf-id="s03"
        id="s03"
        class="clip film-shot"
        data-composition-id="shot-03-projection"
        data-composition-src="compositions/frames/shot-03-projection.html"
        data-start="19.56"
        data-duration="9.54"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 04: The Typo Glitch -->
      <div
        data-hf-id="s04"
        id="s04"
        class="clip film-shot"
        data-composition-id="shot-04-typo"
        data-composition-src="compositions/frames/shot-04-typo.html"
        data-start="29.10"
        data-duration="9.46"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 05: The Calibration -->
      <div
        data-hf-id="s05"
        id="s05"
        class="clip film-shot"
        data-composition-id="shot-05-calibration"
        data-composition-src="compositions/frames/shot-05-calibration.html"
        data-start="38.56"
        data-duration="8.98"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Master Narration Audio Track -->
      <audio
        data-hf-id="audio-narration"
        id="audio-narration"
        src=".temp_audio/master_sound_design.wav"
        data-start="0"
        data-duration="47.54"
        data-track-index="10"
        data-volume="1.0"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const masterTl = gsap.timeline({ paused: true });
      window.__timelines["predictive-processing-main"] = masterTl;

      const s01 = document.getElementById("s01");
      const s02 = document.getElementById("s02");
      const s03 = document.getElementById("s03");
      const s04 = document.getElementById("s04");
      const s05 = document.getElementById("s05");

      // Seamless film dissolves
      masterTl.fromTo(s02, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 10.90);
      masterTl.to(s01, { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 10.90);

      masterTl.fromTo(s03, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 19.56);
      masterTl.to(s02, { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 19.56);

      masterTl.fromTo(s04, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 29.10);
      masterTl.to(s03, { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 29.10);

      masterTl.fromTo(s05, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 38.56);
      masterTl.to(s04, { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 38.56);
    </script>
  </body>
</html>
