<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Crossed Wires — Jack Butcher Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000000;
        overflow: hidden;
      }
      #root {
        width: 1080px;
        height: 1920px;
        position: relative;
        overflow: hidden;
        background: #000000;
      }
      .film-shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div
      data-hf-id="root"
      id="root"
      data-composition-id="crossed-wires-main"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="56.74"
    >
      <!-- Diagram 01: The Tasting Number (0.00s - 9.46s) -->
      <div
        data-hf-id="s01"
        id="s01"
        class="clip film-shot"
        data-composition-id="shot-01-tasting-number"
        data-composition-src="compositions/frames/shot-01-tasting-number.html"
        data-start="0.00"
        data-duration="9.46"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 02: The Crossed Board (9.46s - 22.36s) -->
      <div
        data-hf-id="s02"
        id="s02"
        class="clip film-shot"
        data-composition-id="shot-02-crossed-board"
        data-composition-src="compositions/frames/shot-02-crossed-board.html"
        data-start="9.46"
        data-duration="12.90"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 03: The Remapping Engine (22.36s - 32.30s) -->
      <div
        data-hf-id="s03"
        id="s03"
        class="clip film-shot"
        data-composition-id="shot-03-remapping"
        data-composition-src="compositions/frames/shot-03-remapping.html"
        data-start="22.36"
        data-duration="9.94"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 04: The Creativity Boost (32.30s - 46.16s) -->
      <div
        data-hf-id="s04"
        id="s04"
        class="clip film-shot"
        data-composition-id="shot-04-creativity"
        data-composition-src="compositions/frames/shot-04-creativity.html"
        data-start="32.30"
        data-duration="13.86"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 05: The Universal Connection (46.16s - 56.74s) -->
      <div
        data-hf-id="s05"
        id="s05"
        class="clip film-shot"
        data-composition-id="shot-05-convergence"
        data-composition-src="compositions/frames/shot-05-convergence.html"
        data-start="46.16"
        data-duration="10.58"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Master Audio -->
      <audio
        data-hf-id="audio-master"
        id="audio-master"
        src=".temp_audio/master_sound_design.wav"
        data-start="0"
        data-duration="56.74"
        data-track-index="10"
        data-volume="1.0"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const masterTl = gsap.timeline({ paused: true });
      window.__timelines["crossed-wires-main"] = masterTl;

      const s01 = document.getElementById("s01");
      const s02 = document.getElementById("s02");
      const s03 = document.getElementById("s03");
      const s04 = document.getElementById("s04");
      const s05 = document.getElementById("s05");

      // Crisp cuts between mental model diagrams
      masterTl.fromTo(s02, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 9.46);
      masterTl.fromTo(s03, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 22.36);
      masterTl.fromTo(s04, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 32.30);
      masterTl.fromTo(s05, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 46.16);
    </script>
  </body>
</html>
