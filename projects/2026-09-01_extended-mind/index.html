<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>The Extended Mind — Jack Butcher Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000000;
        overflow: hidden;
      }
      #root {
        width: 1080px;
        height: 1920px;
        position: relative;
        overflow: hidden;
        background: #000000;
      }
      .film-shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div
      data-hf-id="root"
      id="root"
      data-composition-id="extended-mind-main"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="42.26"
    >
      <!-- Shot 01: The Phantom Pocket (0.00s - 8.10s) -->
      <div
        data-hf-id="s01"
        id="s01"
        class="clip film-shot"
        data-composition-id="shot-01-panic"
        data-composition-src="compositions/frames/shot-01-panic.html"
        data-start="0.00"
        data-duration="8.10"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 02: The Cognitive Amputation (8.10s - 16.36s) -->
      <div
        data-hf-id="s02"
        id="s02"
        class="clip film-shot"
        data-composition-id="shot-02-amputation"
        data-composition-src="compositions/frames/shot-02-amputation.html"
        data-start="8.10"
        data-duration="8.26"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 03: The Extended Mind Thesis (16.36s - 25.90s) -->
      <div
        data-hf-id="s03"
        id="s03"
        class="clip film-shot"
        data-composition-id="shot-03-extended-mind"
        data-composition-src="compositions/frames/shot-03-extended-mind.html"
        data-start="16.36"
        data-duration="9.54"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 04: The Silicon Loop (25.90s - 34.16s) -->
      <div
        data-hf-id="s04"
        id="s04"
        class="clip film-shot"
        data-composition-id="shot-04-neural-loop"
        data-composition-src="compositions/frames/shot-04-neural-loop.html"
        data-start="25.90"
        data-duration="8.26"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 05: The Handheld Cyborg (34.16s - 42.26s) -->
      <div
        data-hf-id="s05"
        id="s05"
        class="clip film-shot"
        data-composition-id="shot-05-cyborg-reality"
        data-composition-src="compositions/frames/shot-05-cyborg-reality.html"
        data-start="34.16"
        data-duration="8.10"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Meditative Vocal-Forward Master Audio -->
      <audio
        data-hf-id="audio-master"
        id="audio-master"
        src=".temp_audio/master_sound_design.wav"
        data-start="0"
        data-duration="42.26"
        data-track-index="10"
        data-volume="1.0"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const masterTl = gsap.timeline({ paused: true });
      window.__timelines["extended-mind-main"] = masterTl;

      const s01 = document.getElementById("s01");
      const s02 = document.getElementById("s02");
      const s03 = document.getElementById("s03");
      const s04 = document.getElementById("s04");
      const s05 = document.getElementById("s05");

      // Crisp cuts between mental model diagrams
      masterTl.fromTo(s02, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 8.10);
      masterTl.fromTo(s03, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 16.36);
      masterTl.fromTo(s04, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 25.90);
      masterTl.fromTo(s05, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 34.16);
    </script>
  </body>
</html>
