  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["shot-02-amputation"] = tl;

    const env = document.getElementById("s02-env");
    const stage = document.getElementById("s02-stage");
    const fil1 = document.getElementById("s02-fil-1");
    const fil2 = document.getElementById("s02-fil-2");
    const fil3 = document.getElementById("s02-fil-3");
    const fil4 = document.getElementById("s02-fil-4");
    const severBlade = document.getElementById("s02-sever-blade");
    const severSpark = document.getElementById("s02-sever-spark");
    const offloadedLobe = document.getElementById("s02-offloaded-lobe");
    const metrics = document.getElementById("s02-metrics");
    const lossVal = document.getElementById("s02-loss-val");
    const capFill = document.getElementById("s02-cap-fill");
    const capLoss = document.getElementById("s02-cap-loss");
    const statusText = document.getElementById("s02-status-text");
    const caption = document.getElementById("s02-caption");
    const sub = document.getElementById("s02-sub");

    // Camera initial
    gsap.set(stage, { scale: 0.95, y: 15 });
    gsap.set(metrics, { opacity: 0, y: 20 });

    tl.to(env, { scale: 1.05, duration: 8.26, ease: "none" }, 0);
    tl.to(stage, { scale: 1.02, y: 0, duration: 8.26, ease: "power1.out" }, 0);

    // 0.0s - 3.2s: "You don't just feel like you lost a gadget."
    tl.to(metrics, { opacity: 1, y: 0, duration: 0.6 }, 0.5);

    // 3.2s - 8.26s: "You feel as though thirty percent of your memory was instantly amputated."
    tl.call(() => {
      caption.innerHTML = 'Thirty percent of your memory was <span class="accent">instantly amputated</span>.';
      sub.innerHTML = 'THE SEVERED EXTERNAL LOBE';
    }, null, 3.2);

    // 2.5s: Sharp amputation severance strike
    tl.to(severBlade, { opacity: 1, duration: 0.1 }, 2.5);
    tl.fromTo(severSpark, { opacity: 1, scale: 0.2 }, { opacity: 0, scale: 2.5, duration: 0.6, ease: "power2.out" }, 2.5);
    tl.to(severBlade, { opacity: 0, duration: 0.2 }, 2.8);

    // Filaments sever and flash amber
    tl.to([fil1, fil2, fil3, fil4], { stroke: "#D4622B", strokeDasharray: "8 8", opacity: 0.35, duration: 0.4 }, 2.5);
    tl.to(offloadedLobe, { opacity: 0.2, x: 20, duration: 0.8, ease: "power2.out" }, 2.5);

    // Metric updates to -30%
    const lossObj = { val: 0 };
    tl.to(lossObj, {
      val: 30,
      duration: 1.8,
      ease: "power2.out",
      onUpdate: function() {
        lossVal.innerText = "-" + Math.round(lossObj.val) + "%";
      }
    }, 2.6);

    tl.to(capFill, { width: "70%", duration: 1.8, ease: "power2.out" }, 2.6);
    tl.to(capLoss, { opacity: 1, duration: 0.3 }, 2.6);
    tl.call(() => {
      statusText.innerText = "AMPUTATED";
      statusText.style.color = "#D4622B";
    }, null, 2.7);
  </script>
