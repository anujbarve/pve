  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

    <div data-hf-id="hf-s01-view" class="scene-viewport">
      <div data-hf-id="hf-s01-stage" id="s01-stage" class="stage-container">
        
        <!-- Spatial Pocket Geometry -->

              <rect x="10" y="10" width="180" height="300" rx="32" stroke="rgba(242, 210, 75, 0.4)" stroke-width="2.5" stroke-dasharray="8 8" fill="rgba(242, 210, 75, 0.03)" />
              <line x1="75" y1="26" x2="125" y2="26" stroke="rgba(242, 210, 75, 0.4)" stroke-width="3" stroke-linecap="round" />

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["shot-01-panic"] = tl;

    const env = document.getElementById("s01-env");
    const stage = document.getElementById("s01-stage");
    const reachActive = document.getElementById("s01-reach-active");
    const reachReticle = document.getElementById("s01-reach-reticle");
    const shockWave = document.getElementById("s01-shock-wave");
    const ghostPhone = document.getElementById("s01-ghostphone");
    const statusPill = document.getElementById("s01-status");
    const pulseCard = document.getElementById("s01-pulse-card");
    const pulseVal = document.getElementById("s01-pulse-val");
    const caption = document.getElementById("s01-caption");
    const sub = document.getElementById("s01-sub");

    // Initial setup
    gsap.set(stage, { scale: 0.94, y: 15 });
    gsap.set(pulseCard, { opacity: 0, y: 15 });
    gsap.set(statusPill, { opacity: 0, scale: 0.8 });

    // Slow cinematic camera push
    tl.to(env, { scale: 1.06, duration: 8.10, ease: "none" }, 0);
    tl.to(stage, { scale: 1.02, y: 0, duration: 8.10, ease: "power1.out" }, 0);

    // 0.4s - 3.4s: Reaching into pocket
    tl.to(reachActive, { strokeDashoffset: 0, duration: 2.4, ease: "power2.out" }, 0.4);
    tl.to(reachReticle, { opacity: 1, duration: 0.3 }, 2.6);

    // 3.5s - 8.1s: Shock of physical panic
    tl.call(() => {
      caption.innerHTML = 'For ten seconds, a spike of <span class="accent">physical panic</span> grips your chest.';
      sub.innerHTML = 'SOMATIC ALARM TRIGGER';
    }, null, 3.5);

    // Void alert triggers & shockwave ripples
    tl.to(statusPill, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.7)" }, 3.6);
    tl.fromTo(shockWave, { r: 15, opacity: 0.9 }, { r: 160, opacity: 0, duration: 1.2, repeat: 2, ease: "power2.out" }, 3.6);
    tl.to(ghostPhone, { x: 3, duration: 0.05, repeat: 9, yoyo: true, ease: "rough" }, 3.6);

    // Somatic pulse spikes (Heart rate rises from 68 to 134 BPM)
    tl.to(pulseCard, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 4.0);
    const hrObj = { hr: 68 };
    tl.to(hrObj, {
      hr: 134,
      duration: 2.5,
      ease: "power2.out",
      onUpdate: function() {
        pulseVal.innerText = Math.round(hrObj.hr) + " BPM";
      }
    }, 4.2);
  </script>
