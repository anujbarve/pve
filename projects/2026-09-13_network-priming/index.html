<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Network Priming — Jack Butcher Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000000;
        overflow: hidden;
      }
      #root {
        width: 1080px;
        height: 1920px;
        position: relative;
        overflow: hidden;
        background: #000000;
      }
      .film-shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div
      data-hf-id="root"
      id="root"
      data-composition-id="network-priming-main"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="60.74"
    >
      <!-- Diagram 01: The Flash Word (0.00s - 9.38s) -->
      <div
        data-hf-id="s01"
        id="s01"
        class="clip film-shot"
        data-composition-id="shot-01-flash-word"
        data-composition-src="compositions/frames/shot-01-flash-word.html"
        data-start="0.00"
        data-duration="9.38"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 02: The Spreading Activation (9.38s - 20.76s) -->
      <div
        data-hf-id="s02"
        id="s02"
        class="clip film-shot"
        data-composition-id="shot-02-spreading"
        data-composition-src="compositions/frames/shot-02-spreading.html"
        data-start="9.38"
        data-duration="11.38"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 03: The Semantic Distance Map (20.76s - 35.98s) -->
      <div
        data-hf-id="s03"
        id="s03"
        class="clip film-shot"
        data-composition-id="shot-03-semantic-map"
        data-composition-src="compositions/frames/shot-03-semantic-map.html"
        data-start="20.76"
        data-duration="15.22"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 04: The Implicit Bias Machine (35.98s - 50.32s) -->
      <div
        data-hf-id="s04"
        id="s04"
        class="clip film-shot"
        data-composition-id="shot-04-implicit-bias"
        data-composition-src="compositions/frames/shot-04-implicit-bias.html"
        data-start="35.98"
        data-duration="14.34"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Diagram 05: The Awareness (50.32s - 60.74s) -->
      <div
        data-hf-id="s05"
        id="s05"
        class="clip film-shot"
        data-composition-id="shot-05-awareness"
        data-composition-src="compositions/frames/shot-05-awareness.html"
        data-start="50.32"
        data-duration="10.42"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Master Audio -->
      <audio
        data-hf-id="audio-master"
        id="audio-master"
        src=".temp_audio/master_sound_design.wav"
        data-start="0"
        data-duration="60.74"
        data-track-index="10"
        data-volume="1.0"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const masterTl = gsap.timeline({ paused: true });
      window.__timelines["network-priming-main"] = masterTl;

      const s01 = document.getElementById("s01");
      const s02 = document.getElementById("s02");
      const s03 = document.getElementById("s03");
      const s04 = document.getElementById("s04");
      const s05 = document.getElementById("s05");

      // Crisp cuts between mental model diagrams
      masterTl.fromTo(s02, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 9.38);
      masterTl.fromTo(s03, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 20.76);
      masterTl.fromTo(s04, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 35.98);
      masterTl.fromTo(s05, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 50.32);
    </script>
  </body>
</html>
