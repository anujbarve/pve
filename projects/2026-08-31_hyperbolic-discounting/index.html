<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Hyperbolic Discounting — The Present Bias Trap</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Playfair Display";
        font-style: normal;
        font-weight: 400 900;
        src: url(https://fonts.gstatic.com/s/playfairdisplay/v40/nuFiD-vYSZviVYUb_rj3ij__anPXDTzYgEM86xQ.woff2) format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2) format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000000;
        overflow: hidden;
      }
      #root {
        width: 1080px;
        height: 1920px;
        position: relative;
        overflow: hidden;
        background: #000000;
      }
      .film-shot {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div
      data-hf-id="root"
      id="root"
      data-composition-id="hyperbolic-discounting-main"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="34.90"
    >
      <!-- Shot 01: The Rational Architect (0.00s - 6.98s) -->
      <div
        data-hf-id="s01"
        id="s01"
        class="clip film-shot"
        data-composition-id="shot-01-alarm-night"
        data-composition-src="compositions/frames/shot-01-alarm-night.html"
        data-start="0.00"
        data-duration="6.98"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 02: The Morning Ambush (6.98s - 14.12s) -->
      <div
        data-hf-id="s02"
        id="s02"
        class="clip film-shot"
        data-composition-id="shot-02-snooze-morning"
        data-composition-src="compositions/frames/shot-02-snooze-morning.html"
        data-start="6.98"
        data-duration="7.14"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 03: The Hyperbolic Cliff (14.12s - 21.18s) -->
      <div
        data-hf-id="s03"
        id="s03"
        class="clip film-shot"
        data-composition-id="shot-03-hyperbolic-cliff"
        data-composition-src="compositions/frames/shot-03-hyperbolic-cliff.html"
        data-start="14.12"
        data-duration="7.06"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 04: The Estranged Future Self (21.18s - 28.24s) -->
      <div
        data-hf-id="s04"
        id="s04"
        class="clip film-shot"
        data-composition-id="shot-04-two-selves"
        data-composition-src="compositions/frames/shot-04-two-selves.html"
        data-start="21.18"
        data-duration="7.06"
        data-track-index="2"
        data-layout-allow-overlap
      ></div>

      <!-- Shot 05: The Ulysses Contract (28.24s - 34.90s) -->
      <div
        data-hf-id="s05"
        id="s05"
        class="clip film-shot"
        data-composition-id="shot-05-commitment-lock"
        data-composition-src="compositions/frames/shot-05-commitment-lock.html"
        data-start="28.24"
        data-duration="6.66"
        data-track-index="1"
        data-layout-allow-overlap
      ></div>

      <!-- Master 3-Layer Audio Soundtrack (VO + BGM + SFX) -->
      <audio
        data-hf-id="audio-master"
        id="audio-master"
        src=".temp_audio/master_sound_design.wav"
        data-start="0"
        data-duration="34.90"
        data-track-index="10"
        data-volume="1.0"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const masterTl = gsap.timeline({ paused: true });
      window.__timelines["hyperbolic-discounting-main"] = masterTl;

      const s01 = document.getElementById("s01");
      const s02 = document.getElementById("s02");
      const s03 = document.getElementById("s03");
      const s04 = document.getElementById("s04");
      const s05 = document.getElementById("s05");

      // Crossfades between shots
      masterTl.fromTo(s02, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 6.98);
      masterTl.to(s01, { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 6.98);

      masterTl.fromTo(s03, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 14.12);
      masterTl.to(s02, { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 14.12);

      masterTl.fromTo(s04, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 21.18);
      masterTl.to(s03, { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 21.18);

      masterTl.fromTo(s05, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 28.24);
      masterTl.to(s04, { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 28.24);
    </script>
  </body>
</html>
