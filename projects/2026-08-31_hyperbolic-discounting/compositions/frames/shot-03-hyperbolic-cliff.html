  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["shot-03-hyperbolic-cliff"] = tl;

    const env = document.getElementById("s03-env");
    const stage = document.getElementById("s03-stage");
    const hyperPath = document.getElementById("s03-hyper-path");
    const rationalPath = document.getElementById("s03-rational-path");
    const peakDot = document.getElementById("s03-peak-dot");
    const spikeBox = document.getElementById("s03-spike-box");
    const caption = document.getElementById("s03-caption");
    const sub = document.getElementById("s03-sub");

    // Setup initial path length animation
    const hyperLength = hyperPath.getTotalLength();
    gsap.set(hyperPath, { strokeDasharray: hyperLength, strokeDashoffset: hyperLength });
    const rationalLength = rationalPath.getTotalLength();
    gsap.set(rationalPath, { strokeDasharray: rationalLength, strokeDashoffset: rationalLength });
    gsap.set(peakDot, { scale: 0, opacity: 0 });
    gsap.set(spikeBox, { opacity: 0, y: 15 });
    gsap.set(stage, { scale: 0.95 });

    // Slow push
    tl.to(env, { scale: 1.05, duration: 7.06, ease: "none" }, 0);
    tl.to(stage, { scale: 1.02, duration: 7.06, ease: "power1.out" }, 0);

    // Draw rational curve 0.4s to 2.0s
    tl.to(rationalPath, { strokeDashoffset: 0, duration: 1.6, ease: "power2.out" }, 0.4);

    // 2.6s - 3.2s: "it drops rewards off a steep hyperbolic cliff"
    tl.call(() => {
      caption.innerHTML = 'it drops rewards off a <span class="accent">steep hyperbolic cliff</span>.';
      sub.innerHTML = 'Subjective Valuation · V = A / (1 + kD)';
    }, null, 2.6);

    // Explode hyperbolic curve upward from 2.5s to 4.5s
    tl.to(hyperPath, { strokeDashoffset: 0, duration: 2.0, ease: "power3.inOut" }, 2.5);
    tl.to(peakDot, { scale: 1.4, opacity: 1, duration: 0.5, ease: "back.out(2)" }, 4.2);
    tl.to(spikeBox, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 4.3);
